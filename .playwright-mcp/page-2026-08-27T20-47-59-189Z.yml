          - generic [ref=f97e49]:
            - paragraph [ref=f97e50]: 株式会社ロールクラウドジャパン（以下、当社）は、以下のとおり個人情報保護方針を定め、個人情報保護の仕組みを構築し、全従業員に個人情報保護の重要性の認識と取組みを徹底させることにより、個人情報の保護を推進致します。
            - list [ref=f97e51]:
              - listitem [ref=f97e52]:
                - text: 個人情報の管理
                - paragraph [ref=f97e53]: 当社は、お客さまの個人情報を正確かつ最新の状態に保ち、個人情報への不正アクセス・紛失・破損・改ざん・漏洩などを防止するため、セキュリティシステムの維持・管理体制の整備・社員教育の徹底等の必要な措置を講じ、安全対策を実施し個人情報の厳重な管理を行ないます。
              - listitem [ref=f97e54]:
                - text: 個人情報の利用目的
                - paragraph [ref=f97e55]: お客さまからお預かりした個人情報は、当社からのご連絡や業務のご案内やご質問に対する回答として、電子メールや資料のご送付に利用いたします。
              - listitem [ref=f97e56]:
                - text: 個人情報の第三者への開示・提供の禁止
                - paragraph [ref=f97e57]: 当社は、お客さまよりお預かりした個人情報を適切に管理し、次のいずれかに該当する場合を除き、個人情報を第三者に開示いたしません。
                - list [ref=f97e58]:
                  - listitem [ref=f97e59]: お客さまの同意がある場合
                  - listitem [ref=f97e60]: お客さまが希望されるサービスを行なうために当社が業務を委託する業者に対して開示する場合
                  - listitem [ref=f97e61]: 法令に基づき開示することが必要である場合
              - listitem [ref=f97e62]:
                - text: 個人情報の安全対策
                - paragraph [ref=f97e63]: 当社は、個人情報の正確性及び安全性確保のために、セキュリティに万全の対策を講じています。
              - listitem [ref=f97e64]:
                - text: ご本人の照会
                - paragraph [ref=f97e65]: お客さまがご本人の個人情報の照会・修正・削除などをご希望される場合には、ご本人であることを確認の上、対応させていただきます。
              - listitem [ref=f97e66]:
                - text: 法令、規範の遵守と見直し
                - paragraph [ref=f97e67]: 当社は、保有する個人情報に関して適用される日本の法令、その他規範を遵守するとともに、本ポリシーの内容を適宜見直し、その改善に努めます。
              - listitem [ref=f97e68]:
                - text: お問い合わせ
                - paragraph [ref=f97e69]: 個人情報の取扱に関するお問い合せは下記までご連絡ください。 株式会社ロールクラウドジャパン 〒812-0033 福岡県福岡市博多区大博町2-9 2F TEL：092-406-5056
