      - generic [ref=f41e44]:
        - paragraph [ref=f41e45]: 世の中には「社会が良くなることを妨げているので解決すべき問題」や「解決できれば社会がもっとよくなる問題」があふれています。 当社では、これらを「解消すべきひずみ」と呼んでおり、当社が「社会のひずみを解消するサービス」を提供することで、世の中のひずみをひとつずつ解消していくことを使命としています。 四方よしとは買い手よし、売り手よし、世間よしの三方よしの精神に、従業員も幸せであるべきとの考えを加えた造語です。 社会のひずみを解消するサービスを運営し、四方よしを実現します。
