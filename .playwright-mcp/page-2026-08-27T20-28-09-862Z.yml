        - paragraph [ref=f41e55]: トップシェアの歯科従事者向けの人材紹介ファーストナビを基盤に、歯科検索サイトや求人広告サイトを展開し、採用・集患・業務システムの面から包括的に歯科業界を支援しています。 また、歯科で培ったノウハウをもとに、医療・介護領域へサービスを展開しています。
