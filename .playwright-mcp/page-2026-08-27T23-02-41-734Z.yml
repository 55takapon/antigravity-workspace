            - heading "合同会社オーエイチピー 個人情報保護方針" [level=1] [ref=f517e56]: 合同会社オーエイチピー個人情報保護方針
            - heading "個人情報の管理" [level=2] [ref=f517e57]
            - paragraph [ref=f517e58]: 合同会社オーエイチピー（以下OHPという）は、お客さまの個人情報を正確かつ最新の状態に保ち、個人情報への不正アクセス・紛失・破損・改ざん・漏洩などを防止するため、セキュリティシステムの維持・管理体制の整備の徹底等の必要な措置を講じ、安全対策を実施し個人情報の厳重な管理を行います。
            - heading "個人情報の利用目的" [level=2] [ref=f517e59]
            - paragraph [ref=f517e60]: お客さまからお預かりした個人情報は、OHPからのご連絡や業務のご案内やご質問に対する回答として、電子メールや資料のご送付に利用いたします。
            - heading "個人情報の第三者への開示・提供の禁止" [level=2] [ref=f517e61]
            - paragraph [ref=f517e62]: OHPは、お客さまよりお預かりした個人情報を適切に管理し、次のいずれかに該当する場合を除き、個人情報を第三者に開示いたしません。
            - list [ref=f517e63]:
              - listitem [ref=f517e64]: お客さまの同意がある場合
              - listitem [ref=f517e65]: お客さまが希望されるサービスを行なうために当社が業務を委託する業者に対して開示する場合
              - listitem [ref=f517e66]: 法令に基づき開示することが必要である場合（令状のない警察官への開示は行いません。）
            - heading "個人情報の安全対策" [level=2] [ref=f517e67]
            - paragraph [ref=f517e68]: OHPは、個人情報の正確性及び安全性確保のために、セキュリティに万全の対策を講じています。
            - heading "ご本人の照会" [level=2] [ref=f517e69]
            - paragraph [ref=f517e70]: お客さまがご本人の個人情報の照会・修正・削除などをご希望される場合には、ご本人であることを確認の上、対応させていただきます。
            - heading "アクセス解析ツールについて" [level=2] [ref=f517e71]
            - paragraph [ref=f517e72]:
              - text: 当サイトでは、Googleによるアクセス解析ツール「Googleアナリティクス」を利用しています。 Googleアナリティクスはトラフィックデータの収集のためにCookieを使用しています。 このトラフィックデータは匿名で収集されており、個人を特定するものではありません。 この機能はCookieを無効にすることで収集を拒否することが出来ますので、お使いのブラウザの設定をご確認ください。この規約に関して、詳しくは
              - link "Google アナリティクス利用規約" [ref=f517e73] [cursor=pointer]:
                - /url: https://www.google.com/analytics/terms/jp.html
              - text: をご覧ください。
            - heading "免責事項" [level=2] [ref=f517e74]
            - paragraph [ref=f517e75]: 当サイトからリンクやバナーなどによって他のサイトに移動された場合、移動先サイトで提供される情報、サービス等について一切の責任を負いません。
            - paragraph [ref=f517e76]: 当サイトのコンテンツ・情報につきまして、可能な限り正確な情報を掲載するよう努めておりますが、誤情報が入り込んだり、情報が古くなっていることもございます。
            - paragraph [ref=f517e77]: 当サイトに掲載された内容によって生じた損害等の一切の責任を負いかねますのでご了承ください。
            - heading "法令、規範の遵守と見直し" [level=2] [ref=f517e78]
            - paragraph [ref=f517e79]: OHPは、保有する個人情報に関して適用される日本の法令、その他規範を遵守するとともに、本ポリシーの内容を適宜見直し、その改善に努めます。
            - heading "お問い合わせ" [level=2] [ref=f517e80]
            - paragraph [ref=f517e81]: OHPの個人情報の取り扱いに関するお問い合わせは下記までご連絡ください。
