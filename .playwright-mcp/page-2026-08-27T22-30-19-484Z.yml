              - paragraph [ref=f404e814]: 1982年生まれ。 日本大学芸術学部デザイン学科卒業後、東京の広告代理店にてデザイナー、ディレクターとして勤務。商社、システム会社、金融機関、教育機関など、さまざまな業種のデザインに幅広く関わり、退職後、愛媛にUターン。2014年よりLAYERSという屋号でフリーランスのディレクター、デザイナーをスタート。同時に河原デザイン・アート専門学校でも非常勤講師を務めるなど人材教育にも携わる。さらに17年秋にはスポーツ及びフィトネス関連事業をおこなう「株式会社KuruSPO」を設立、翌年より制作事業も統合し現在に至る。18年には「えひめ地域活性化ファンド」より投資を受け、翌年「えひめイノベーション起業塾」最優秀賞を受賞。
