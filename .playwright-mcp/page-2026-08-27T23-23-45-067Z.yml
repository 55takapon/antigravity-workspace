          - heading [level=1] [ref=f562e49]:
            - img "お問合せフォーム" [ref=f562e50]
          - paragraph [ref=f562e51]: インフォマークでは、ホームページ内のお問合せページ（エントリーフォーム）を訪問者のゴールページと設定し、離脱を防ぐ具体的方法として必要項目にストレス無く入力してもらう為の方法を徹底的に分析したエントリーフォーム最適化システム（EFO）を開発しました。
          - paragraph [ref=f562e52]:
            - text: 当社お問合せフォームも「EFO」を導入したフォームとなります。 下記フォームよりお気軽にお問合せいただき、「EFO」の快適さを実感してください。 お問合せ後、担当者より折り返しご連絡いたします。 背景色が 薄い赤色 の項目は必須入力項目です。お忘れのないようご入力ください。 ご入力いただいた情報は、弊社
            - link "プライバシーポリシー" [ref=f562e53] [cursor=pointer]:
              - /url: http://www.informarc.co.jp/privacy/
            - text: に基き厳重に管理いたします。
