              - paragraph [ref=f174e129]: c) 個人情報の利用目的 • 当社へのお問合せについてのご回答及びご連絡のため • 当社もしくは協力会社において、当社が出展または主催するイベント・展示会・セミナー等のご案内、 当社が提供する商品・サービスに関するご案内など各種情報のご提供のため • 当社営業部門からのご連絡のため
              - paragraph [ref=f174e130]: d) 個人情報を第三者に提供する場合 当社は、法令等による場合を除き、本人の同意を得ずに当フォームにてご提供いただく個人情報を第三者に提供することはありません。
              - paragraph [ref=f174e131]: e) 個人情報の取扱いの委託を行う場合 当社は、個人情報の委託を行う場合、当社が定めた業務委託先の選定基準を満たし、個人情報保護のための環境整備等の評価を行ないます。委託先として認定した場合は個人情報の取扱いなどの個人情報保護に関する契約を締結し、適切な管理、監督を行ないます。
              - paragraph [ref=f174e132]: f) 個人情報の開示等の請求について 当社は、保有個人情報について、開示等（利用目的の通知、開示、内容の訂正、追加又は削除、利用の停止、消去、第三者への提供の停止及び第三者提供記録の開示）を求められた場合は、これに応じます。その場合の問合せ窓口は、上記個人情報保護管理者です。
              - paragraph [ref=f174e133]: g) 個人情報の提供の任意性 個人情報の提供は任意です。ご提供いただけない場合は、お問合せについて正確なご回答を行うことができない可能性があります。
              - paragraph [ref=f174e134]: h) 自動的な情報の取得 当社では、ご本人様が容易に認識出来ない方法(Cookie等)で個人情報を取得することは一切いたしません。
