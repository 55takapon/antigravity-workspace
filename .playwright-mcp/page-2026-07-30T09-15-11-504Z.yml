        - generic [ref=f2e256]:
          - paragraph [ref=f2e258]: 美容業界に特化したWEBマーケティングを展開し、クライアントのビジネス成長に徹底的にコミットします。年間5,200回以上の広告・LP改善データをもとに、市場主義に基づいた勝ちパターンを導き出し、最適なマーケティング戦略を提供します。
          - generic [ref=f2e259]:
            - generic [ref=f2e260]:
              - paragraph [ref=f2e261]: "01"
              - generic [ref=f2e263]:
                - paragraph [ref=f2e264]: 毎週改善・毎週報告
                - paragraph [ref=f2e265]: WEB広告運用
              - paragraph [ref=f2e267]: 「月イチ報告だけ」「ペラっと報告書が来るだけ」──そんな広告代理店の“あるある”を、根本から覆します。エフェクトプロは、広告運用だけでなくLPまで毎日モニタリング・毎日改善。圧倒的なコミット力で、成果にこだわり抜く“追求型の広告チーム”です。
              - link "arrow_forward 詳しく見る" [ref=f2e268] [cursor=pointer]:
                - /url: /service
                - generic [ref=f2e269]:
                  - generic [ref=f2e270]: arrow_forward
                  - paragraph [ref=f2e272]: 詳しく見る
            - generic [ref=f2e273]:
              - paragraph [ref=f2e274]: "02"
              - generic [ref=f2e276]:
                - paragraph [ref=f2e277]: モバイルスワイプ型
                - paragraph [ref=f2e278]: 動画LP ®
              - paragraph [ref=f2e280]: スワイプで引き込む、縦長動画LP。ショート動画時代に最適化された構成で、サービスの魅力を“体感”させながら伝える。没入感×情報量で、スクロール型LPでは届かないコンバージョン力を生み出します。
              - link "arrow_forward 詳しく見る" [ref=f2e281] [cursor=pointer]:
