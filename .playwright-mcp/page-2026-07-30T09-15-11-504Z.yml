    - generic [ref=f2e300]:
      - generic [ref=f2e301]:
        - generic [ref=f2e302]:
          - paragraph [ref=f2e304]: REASON
          - paragraph [ref=f2e305]: エフェクトプロは、日本最多の美容広告データを活用し、成果に徹底コミットする広告代理店。自社で美容クリニック・ピラティススタジオを運営し、広告効果だけでなく、成約率やLTV、継続率まで含めて事業として成立するかを日々検証しています。その実業経験を背景に、事業構造を理解した上での改善量と成果へのコミットは、一般的な広告代理店とは次元が異なります。数字を回すだけでは終わらせない。本気で事業を伸ばすための広告運用を行います。
        - generic [ref=f2e306]:
          - generic [ref=f2e308]:
            - generic [ref=f2e309]:
              - generic [ref=f2e310]:
                - paragraph [ref=f2e311]: "01"
                - paragraph [ref=f2e312]: 選ばれる理由
              - generic [ref=f2e313]:
                - paragraph [ref=f2e314]: LP/広告の毎週の
                - paragraph [ref=f2e315]: 提案＆改善
            - paragraph [ref=f2e316]: 毎日広告とLPをモニタリングし、数値の違和感があれば予算消化を待たず、すぐに仮説を立て、広告もLPも改善に着手。一般的な広告代理店では、LP修正は追加料金が発生するケースがほとんどですが、私たちは成果を追うために必要な改善であれば、追加料金はいただきません。広告とLPは切り離せないもの。 だからこそ、運用と改善を一体で考え、 勝つために必要なことは、すべてやる。 この姿勢が、結果の差を生み出します。
          - generic [ref=f2e318]:
            - generic [ref=f2e319]:
              - generic [ref=f2e320]:
                - paragraph [ref=f2e321]: "02"
                - paragraph [ref=f2e322]: 選ばれる理由
              - generic [ref=f2e323]:
                - paragraph [ref=f2e324]: 広告成果ではなく
                - paragraph [ref=f2e325]: 事業成果を見る運用
            - paragraph [ref=f2e326]: 私たちは広告の数値だけを見ていません。成約率・LTV・継続率まで含めて「事業として伸びているか」を重視しています。広告が当たっても、成約しなければ意味がない。成約しても、継続しなければ事業は伸びない。その前提に立ち、事業全体を理解したうえで改善を行います。広告運用ではなく、事業改善の一部として広告を扱う。それがエフェクトプロのスタンスです。
          - generic [ref=f2e328]:
            - generic [ref=f2e329]:
              - generic [ref=f2e330]:
                - paragraph [ref=f2e331]: "03"
                - paragraph [ref=f2e332]: 選ばれる理由
              - generic [ref=f2e333]:
                - paragraph [ref=f2e334]: 自社で実業を運営し
                - paragraph [ref=f2e335]: 成果を検証
            - paragraph [ref=f2e336]: エフェクトプロは、広告代理店であると同時に、美容クリニックやピラティススタジオ、美容メーカーなどの実業を自社で運営しています。広告費を使う側として、集客・成約・継続・LTVまでを日々リアルに検証。その現場経験があるからこそ、机上の空論ではない改善提案が可能です。「やったことがある」ではなく、「今もやっている」。この実業経験が、提案と改善の質を根本から支えています。
          - generic [ref=f2e339]:
            - generic [ref=f2e340]:
              - generic [ref=f2e341]:
                - paragraph [ref=f2e342]: "04"
                - paragraph [ref=f2e343]: 選ばれる理由
              - generic [ref=f2e344]:
                - paragraph [ref=f2e345]: 成果に本気で
                - paragraph [ref=f2e346]: コミットする体制
            - paragraph [ref=f2e347]: エフェクトプロは、運用して終わりの広告代理店ではありません。成果が出るまで向き合い、考え、改善し続けます。事業を理解し、数字に向き合い、「なぜ伸びないのか」「どこを変えるべきか」を徹底的に掘り下げる。その改善量とコミット量は、他社と比べても圧倒的だと自負しています。広告を任せるのではなく、事業の成長を一緒に背負うパートナーとして関わる。それがエフェクトプロの仕事です。
      - paragraph [ref=f2e350]: エフェクトプロのWEBマーケティングが選ばれる理由
