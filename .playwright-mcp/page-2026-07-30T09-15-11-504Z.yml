              - paragraph [ref=f2e287]: "03"
              - generic [ref=f2e289]:
                - paragraph [ref=f2e290]: 社員よりも社員らしく
                - paragraph [ref=f2e291]: マーケティングパートナー
              - paragraph [ref=f2e293]: 事業モデルや顧客構造、LTVまで深く理解し、戦略設計から広告運用・LP改善・分析まで一気通貫で支援。外注ではなく“自分ごと”で動く、事業目標に伴走するマーケティングパートナーです。
              - link "arrow_forward 詳しく見る" [ref=f2e294] [cursor=pointer]:
