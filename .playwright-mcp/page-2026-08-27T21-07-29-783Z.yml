                        - article [ref=f202e4]:
                          - heading "『株式会社 イー・フォレストへのご意見・ご要望・お問合せ』における個人情報の取り扱いについて" [level=1] [ref=f202e6]
                          - generic [ref=f202e7]:
                            - generic [ref=f202e8]:
                              - paragraph [ref=f202e9]: 下記規約を必ずお読みください。同意いただきますとフォームよりお問合せいただけます。
                              - paragraph [ref=f202e10]: 株式会社 イー・フォレスト（以下「当社」と言います）では当社へご意見・ご要望・お問合せをいただくお客さま（以下「お客さま」といいます）が、本ウェブサイトその他を通じて当社にご提供・開示いただくお客さまご自身の個人情報について、以下のとおり取り扱っております。お客さまにおかれましては、以下の内容にあらかじめ同意の上で、ご自身の個人情報の提供・開示をお願い申し上げます。
                              - list [ref=f202e11]:
                                - listitem [ref=f202e12]: 利用目的
                                - list [ref=f202e13]:
                                  - listitem [ref=f202e14]: 当社では、お客さまのご意見・ご要望・お問合せへご回答するのみに利用する目的で、お客さまの会社名、氏名、E-Mailアドレス、電話番号等の個人情報に関する情報（以下「個人情報」）を収集いたします。
                                - listitem [ref=f202e15]: 個人情報の第三者への提供について
                                - list [ref=f202e16]:
                                  - listitem [ref=f202e17]: 当社は個人情報を以下のいずれかに該当する場合を除き、第三者へ提供いたしません。
                                  - listitem [ref=f202e18]: ①法令に基づく場合
                                  - listitem [ref=f202e19]: ②人の生命、身体または財産の保護のために必要がある場合であって、ご本人の同意を得ることが困難であるとき
                                  - listitem [ref=f202e20]: ③公衆衛生の向上または児童の健全な育成の推進のために特に必要がある場合であって、ご本人の同意を得ることが困難であるとき
                                  - listitem [ref=f202e21]: ④国の機関もしくは地方公共団体またはその委託を受けた者が法令の定める事務を遂行することに対して協力する必要がある場合であって、ご本人の同意を得ることにより当該事務の遂行に支障を及ぼすおそれがあるとき
                                - listitem [ref=f202e22]: 個人情報の管理について
                                - list [ref=f202e23]:
                                  - listitem [ref=f202e24]: 当社では、お客さまの個人情報を、当社の責任のもとで厳重に管理いたします。
                                - listitem [ref=f202e25]: セキュリティについて
                                - list [ref=f202e26]:
                                  - listitem [ref=f202e27]: 当社ウェブサイトにおいてお客さまに個人情報を提供していただくページには、ＳＳＬ（セキュア・ソケット・レイアー）と呼ばれるデータを暗号化して通信する仕組みを使用しておりますので、万が一、送信データを第三者が傍受した場合でも、内容が盗み取られる心配はございません。またサーバーのデータはファイア・ウォールという不正アクセスを防止するシステムを採用しております。これらの技術によりご登録いただいたお客さまの個人情報が外部に漏れることのないよう、情報の管理・保護に万全を期しております。
                                - listitem [ref=f202e28]: Cookieについて
                                - list [ref=f202e29]:
                                  - listitem [ref=f202e30]: 本ウェブサイトでは、お客さまに一層便利にご利用いただくため、一部のページで「Cookie」という技術を使用する場合があります。Cookieにより、ウェブサイトはお客さまのコンピュータを識別することができるようになりますが、お客さまのお名前、ご住所、電話番号、メールアドレスといった個人を特定可能な情報(個人情報）を取得することは一切ありません。 お客さまは、ご利用いただくブラウザの設定によりCookieの受け取りを拒否したり、Cookieを受け取ったときに警告を表示させたりすることができます。
                                - listitem [ref=f202e31]: 個人情報を提供されることの任意性について
                                - list [ref=f202e32]:
                                  - listitem [ref=f202e33]: お客様が当社に個人情報を提供されるかどうかは、お客様の任意によるものです。ただし、必要な項目をいただけない場合、各サービス等が適切な状態で提供できない場合があります。
                                - listitem [ref=f202e34]: 個人情報に関する問合せ窓口
                                - list [ref=f202e35]:
                                  - listitem [ref=f202e36]: 個人情報の開示、訂正、削除や利用、提供の中止の申出等に関しましては、当社プライバシーポリシー記載のお問い合わせ窓口までご連絡くださいますようお願いいたします。
                              - paragraph [ref=f202e37]: 株式会社 イー・フォレスト 個人情報保護管理者 竹尾 誠一郎
