            - generic [ref=f17e131]:
              - heading "個人情報の取り扱いについて" [level=2] [ref=f17e132]
              - generic [ref=f17e136]:
                - paragraph [ref=f17e137]: 株式会社 ネットインパクト（以下「当社」）は、Webサイト制作、ECサイト構築、システム保守・運用支援などの事業活動を通じて、お客様からお預かりする個人情報を取り扱います。当社は、JIS Q 15001:2023 に準拠した個人情報保護マネジメントシステム（PMS）を構築・運用し、継続的な改善に努め、個人情報の適切な保護を実践します。
                - paragraph [ref=f17e138]: 本方針における「個人情報」とは、個人情報保護法に定める、生存する個人に関する情報（氏名、住所、電話番号、メールアドレスその他の特定の個人を識別できる情報）をいいます。
                - heading "個人情報の利用目的" [level=2] [ref=f17e139]
                - paragraph [ref=f17e140]: 当社は、Web制作関連業務における下記の事業目的に応じて個人情報を利用します。
                - list [ref=f17e141]:
                  - listitem [ref=f17e142]: お問い合わせへの対応
                  - listitem [ref=f17e143]: 見積り・ご提案・契約・業務遂行
                  - listitem [ref=f17e144]: Web制作・ECサイト構築・システム運用に関する業務
                  - listitem [ref=f17e145]: アフターサービス、保守サポート
                  - listitem [ref=f17e146]: 利用状況分析によるサービス改善
                  - listitem [ref=f17e147]: サービス提供に伴う連絡、通知
                  - listitem [ref=f17e148]: 採用選考および連絡
                - paragraph [ref=f17e149]: また、目的外利用を防ぐため、社内規程の整備、従業者教育、アクセス権限管理等の措置を講じ、適正な取扱いを徹底します。
                - heading "個人情報の利用目的" [level=2] [ref=f17e150]
                - paragraph [ref=f17e151]: 当社は、適法かつ公正な手段により個人情報を取得します。また要配慮個人情報は、法律に定めのある場合を除き、本人の同意なく取得しません。
                - heading "法令・指針・その他の規範の遵守" [level=2] [ref=f17e152]
                - paragraph [ref=f17e153]: 当社は、個人情報保護法をはじめとする関係法令、行政ガイドライン等を遵守します。
                - heading "安全管理措置の実施と是正" [level=2] [ref=f17e154]
                - paragraph [ref=f17e155]: 当社は、個人情報への不正アクセス、漏えい、滅失、毀損等を防止するため、次の安全管理措置を講じます。
                - list [ref=f17e156]:
                  - listitem [ref=f17e157]: アクセス権管理
                  - listitem [ref=f17e158]: パスワード管理
                  - listitem [ref=f17e159]: 暗号化・通信保護
                  - listitem [ref=f17e160]: 持ち出し制限
                  - listitem [ref=f17e161]: 教育・訓練
                  - listitem [ref=f17e162]: 内部監査
                  - listitem [ref=f17e163]: 委託先管理
                - paragraph [ref=f17e164]: 万一事故等が発生した場合には、速やかに原因を究明し、是正および再発防止の措置を講じます。
                - heading "苦情および相談への対応" [level=2] [ref=f17e165]
                - paragraph [ref=f17e166]: 当社は、個人情報に関する苦情や相談を受け付ける専用窓口を設け、誠実かつ迅速に対応します。
                - heading "個人情報保護マネジメントシステムの継続的改善" [level=2] [ref=f17e167]
                - paragraph [ref=f17e168]: 当社は、個人情報保護マネジメントシステム（PMS）を定期的に見直し、継続的な改善に努めます。
                - heading "方針の周知および公表" [level=2] [ref=f17e169]
                - paragraph [ref=f17e170]: 当社は、本方針を全従業者に教育等を通じて周知徹底し、社外に対してはWebサイト等を通じて公表します。また、法令改正や社会環境の変化に応じて見直しを行い、常に最新の状態を維持します。
                - heading "適用範囲" [level=2] [ref=f17e171]
                - paragraph [ref=f17e172]: 本方針は、当社が提供するWeb制作および関連するシステム開発・保守・運用サポートなど、すべての業務活動において取り扱う個人情報に適用されます。また、全役員およびすべての従業者（契約社員、派遣社員、アルバイト等を含む）が本方針を理解し、遵守します。
                - heading "個人情報の第三者提供・委託" [level=2] [ref=f17e173]
                - paragraph [ref=f17e174]: 当社は、次の場合を除き、個人情報を第三者へ提供しません。
                - list [ref=f17e175]:
                  - listitem [ref=f17e176]: 本人の同意がある場合
                  - listitem [ref=f17e177]: 法令に基づく場合
                - paragraph [ref=f17e178]: また、業務委託により個人情報を預ける場合は、委託先に対し適切な監督を行います。
                - heading "保有個人データ及び第三者提供記録に関する開示等の請求対応" [level=2] [ref=f17e179]
                - paragraph [ref=f17e180]: 当社は、本人から以下のお申し出があった場合、所定の手続により遅滞なく対応します。
                - list [ref=f17e181]:
                  - listitem [ref=f17e182]: 利用目的の通知
                  - listitem [ref=f17e183]: 開示（保有個人データ及び第三者提供記録）
                  - listitem [ref=f17e184]: 訂正・追加・削除
                  - listitem [ref=f17e185]: 利用停止・消去
                  - listitem [ref=f17e186]: 第三者提供の停止
                - paragraph [ref=f17e187]: ご請求の際は、当社所定の請求書（「個人情報開示等請求書」）により、ご本人であることを確認のうえ対応いたします。代理人によるご請求の場合は、代理権を確認できる書類の提出をお願いします。手数料は当面無料です。請求に応じられない場合は、その理由を説明し、誠実に対応します。
                - paragraph [ref=f17e188]: 【請求窓口】株式会社 ネットインパクト 個人情報保護管理責任者（第13条記載の窓口）
                - heading "Cookie（クッキー）等の利用" [level=2] [ref=f17e189]
                - paragraph [ref=f17e190]: Cookie（クッキー）とはお客様のウェブサイト閲覧情報を、そのお客様のパソコンやスマートフォン、タブレットなどインターネット接続可能な機器（以下「コンピューター」といいます。）に記憶させる機能のことです。
                - heading "1. Cookieの利用目的" [level=3] [ref=f17e191]
                - paragraph [ref=f17e192]: 当社は、お客様が本サイトに再度訪問された際により便利に閲覧していただくため、メールフォームに⼊⼒したお客様の情報を保持するため、および当サイトの利⽤状況を計測・分析するため、Cookie と呼ばれる技術を使⽤しています。お客様が Cookie を使⽤するコンテンツにアクセスされると、お客様のコンピューターに Cookie が記録されますが、お客様個⼈を識別できる情報は⼀切含まれておりません。
                - heading "2. Googleアナリティクスについて" [level=3] [ref=f17e193]
                - paragraph [ref=f17e194]: 当社が利用するCookieには、「Googleアナリティクス」など第三者のCookieもございます。これを使用することで、お客様が閲覧したページに関する情報や本サイト等にアクセスするコンピューターに関する情報（Androidの広告識別子やiOSの広告識別子などのデバイスの識別情報、IPアドレス、オペレーティング・システムやブラウザ種別等）など、本サイト内で行われた活動に関する情報を収集し、分析しております。自動的に収集される第三者のCookieには、個人情報は一切含まれません。三者のCookieの利用は、本サイトにアクセスしている間のみ有効です。第三者が情報を収集して使用する方法・プライバシーポリシーの詳細については、下記をご確認下さい。
                - paragraph [ref=f17e195]:
                  - text: Googleポリシーと規約：
                  - link "https://policies.google.com/ " [ref=f17e196] [cursor=pointer]:
                    - /url: https://policies.google.com/
                    - text: https://policies.google.com/
                    - generic [ref=f17e197]: 
                - heading "3. 第三者による情報利用の同意について" [level=3] [ref=f17e198]
                - paragraph [ref=f17e199]: お客様は、本サイトを利用することで、上記方法および目的において第三者が提供するプログラムによるデータ処理について、同意したものとみなします。
                - heading "4. Cookieの拒否方法" [level=3] [ref=f17e200]
                - paragraph [ref=f17e201]: お客様がブラウザの設定を変更することによりCookieを無効にすることが可能です。ただし、Cookieを無効にした場合は、一部のサービスが受けられない場合があります。Cookieの設定の変更方法については、各ブラウザの製造元へご確認ください。また、Googleアナリティクス オプトアウト アドオンをインストールするとGoogle アナリティクスJavaScript（analytics.js、gtag.js等）によるデータの使用を無効にすることができます。
                - paragraph [ref=f17e202]:
                  - text: Google アナリティクス オプトアウト アドオン：
                  - link "https://tools.google.com/dlpage/gaoptout " [ref=f17e203] [cursor=pointer]:
                    - /url: https://tools.google.com/dlpage/gaoptout
                    - text: https://tools.google.com/dlpage/gaoptout
                    - generic [ref=f17e204]: 
                - heading "免責" [level=2] [ref=f17e205]
                - paragraph [ref=f17e206]: 当サイトにリンクされている他のウェブサイトにおける個人情報等の取扱いについては、一切責任を負いません。
                - heading "個人情報に関する苦情・お問い合わせ窓口" [level=2] [ref=f17e207]
                - paragraph [ref=f17e208]: 株式会社 ネットインパクトの個人情報の取り扱いに関する、苦情・相談・その他のお問い合わせは、下記窓口までご連絡ください。
