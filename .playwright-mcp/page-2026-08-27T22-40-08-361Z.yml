            - paragraph [ref=f432e209]: 愛媛・松山でホームページ制作をご検討中の中小企業の多くが、「ホームページはあるのに問い合わせにつながらない」「何を強みとして打ち出せばよいかわからない」といった課題を抱えています。地方ではWebに詳しい人材が社内にいないことも多く、制作会社に任せきりのまま成果が出ず、放置されてしまうケースも少なくありません。
          - generic [ref=f432e210]:
            - paragraph [ref=f432e211]: 私たちジィクレブは、愛媛県松山市に拠点を置く地域密着のホームページ制作会社です。地域に根ざしているからこそ、対面でじっくりお話を伺い、御社のビジネスや商圏、競合、地域のお客様の温度感までを踏まえた設計ができます。オンラインだけでは伝わりにくい細かなニュアンスも、直接お会いして共有できるのが地元の制作会社の強みです。また、地域の商習慣や季節性、口コミが広がりやすい風土といった愛媛ならではの市場特性を踏まえたうえで、集客につながる情報設計をご提案します。
            - paragraph [ref=f432e212]: 2006年の創業以来、愛媛県で800件以上のサポート実績を積み重ねてきました。士業（弁護士・社労士）、医療（歯科・クリニック）、建設・製造、小売・サービス業など、幅広い業種のホームページ制作に携わり、それぞれの業界特性に合わせた戦略設計から、公開後の運用改善までを一貫してご提供しています。
            - generic [ref=f432e213]:
              - paragraph [ref=f432e214]: 対応エリア
