          - term [ref=f414e97]: お問い合わせ内容
          - definition [ref=f414e98]:
            - textbox [ref=f414e99]: 株式会社イープレス ご担当者様 突然のご連絡失礼いたします。 わたくし、ジェットプロデュース の 田中克章と申します。 写真製版業から始まった技術を活かし、 古い写真や紙をデジタル化にして届けます。 サービスの一つにこう書かれているのを読んで、手が止まりました。 営業、ディレクター、デザイナー、エンジニア、DTPオペレーター、 写真処理・加工、そして校正。 チーム紹介が職種ごとに分かれていて、校正まで独立しています。 紙をどう扱ってきたかが、そのまま体制に残っているのだと感じました。 貴社の取り組みを拝見する中で、 クライアント様への継続支援について、 私がお力になれる部分があるのではと考えました。 サイト制作後も、クライアント様との 接点を保ちながら継続支援したいものの、 日々の制作案件と並行して新たに担当者を 育成し、運用まで担うのは 簡単ではないと思います。 そこで、制作後の Googleビジネスプロフィール運用を 外部担当として担う形で、 お役に立てればと考えています。 ■外部の運用担当として担うこと 現在、クリニック、飲食店、 士業事務所、学習塾など、 10社以上のGoogleビジネスプロフィール運用を 継続してご支援しています。 外部の運用担当として、 主に以下の業務をお引き受けしています。 ・ご提案資料の作成 ・商談への同席、ご説明 ・投稿、クチコミ返信 ・店舗情報の整備、改善 ・月次レポートの作成、ご報告 ・事業者様からのご質問、ご相談への対応 ご提案の段階から、 運用開始後の事業者様とのやり取りまで、 私が責任を持って対応いたします。 今の体制のままでも、 継続支援のご提案がしやすくなれば、 と考えています。 ■制作会社様との連携で大切にしていること 制作会社様のコーディング業務を 年単位で継続して受託してきた経験から、 貴社の業務進行や確認の流れに 合わせて対応いたします。 貴社とクライアント様との関係を大切にし、 窓口や商流を尊重したうえで、 あくまで貴社の案件として携わります。 運用の中で、サービスページの追加や キャンペーン用LPなど、 制作に関するご相談が生まれた際は、 すべて貴社へおつなぎします。 ■この仕事の原点 私がGoogleビジネスプロフィール運用に 力を入れるようになったきっかけは、 かかりつけの歯科医院から、 「低評価のクチコミに、 どう対応すればよいのか」 と相談を受けたことでした。 歯科が苦手で、かかりつけも 持っていなかった私が、 安心して通えるようになった医院でした。 その医院がクチコミ対応で困っていると聞き、 何とかお役に立ちたいと思ったことが、 この仕事の原点です。 支援を続ける中で、 良い仕事をしていても、 その価値が必要な方へ届いていない事業者様は 少なくないと感じています。 探している方と、 その力になれる事業者様をつなぐこと。 Googleマップを通じて、 その接点を増やすことが、 私の役割だと考えています。 「問い合わせが増えた」 「予約につながった」と、 事業者様から直接お声をいただき、 一緒に変化を喜べる距離で支援できることに、 大きなやりがいを感じています。 ■運用事例 実績の一例として、 関西の飲食店では、 2026年5月から運用支援を開始しました。 支援前の4月と、 運用3か月目の7月を比較すると、 ・ルート検索数 月68回から月444回 約6.5倍 ・サイトへの遷移数 月78回から月560回 約7.2倍 ・電話発信数 月10回から月46回 4.6倍 となりました。 クチコミ数も8件から49件へ増加し、 クチコミの平均評価は 3.8から4.3へ上昇しています。 ※4月と7月の単月比較です。 期間中はGoogle検索広告も一部実施しており、 その間接的な影響は切り分けていません （広告クリック自体は上記に含みません）。 その他の事例、 具体的な対応内容、価格については、 以下のページにまとめています。 https://jet-produce.com/lp/partner01/ ご興味をお持ちいただけましたら、 一度オンラインでお話しできれば幸いです。 直近で該当する案件がない場合も、 今後の選択肢として、 まずは情報交換できればと思います。 ご多用のところ、 最後までお読みいただき ありがとうございました。 どうぞよろしくお願いいたします。 ーーーーー ジェットプロデュース 代表 田中 克章 Email kansha@jet-produce.com ーーーーー
        - generic [ref=f414e102]:
          - heading "個人情報の取扱いに関する同意について" [level=3] [ref=f414e103]
          - paragraph [ref=f414e104]: 株式会社イープレスは（以下、｢当社｣）、ご提供いただいたお客様の個人情報を保護するために細心の注意を払い、これを適正に取扱います。 具体的には、以下の方針に基づき、個人情報の管理・運用を行っております。この書面をもって、当社の個人情報の取扱いに関して同意をいただいたものといたします。
          - generic [ref=f414e105]:
            - term [ref=f414e106]: 個人情報の取扱い
            - definition [ref=f414e107]: 当社における個人情報の取扱いは個人情報保護方針に基づいて行います。
            - term [ref=f414e108]: 個人情報とは
            - definition [ref=f414e109]: ｢個人情報｣とは、個人に関する情報であって、当該情報に含まれる氏名、生年月日その他の記述等により特定の個人を識別することができるもの（他の情報と容易に照合することができ、それにより特定の個人を識別することができることとなるものを含む。）をさします。個人にはお客様、取引先従業員、当社従業員、株主を含みます。
            - term [ref=f414e110]: 個人情報保護管理者
            - definition [ref=f414e111]:
              - text: 個人情報は、以下の者が責任をもって管理するものとします。 〒791-8022 愛媛県松山市美沢1丁目7番地5 株式会社イープレス 個人情報保護管理者 新谷 知己 メールアドレス：
              - link "privacy@e-press.co.jp" [ref=f414e112] [cursor=pointer]:
                - /url: mailto:privacy@e-press.co.jp
            - term [ref=f414e113]: 個人情報の利用目的
            - definition [ref=f414e114]: 当社では、お客様の個人情報を、当社の業務において必要な範囲内で下記の利用目的により取得させていただきます。 1．利用者の特定・確認 2．お問い合わせ・ご相談・ご要望への対応及びその記録の為 3．採用に関するお問い合わせ対応
            - term [ref=f414e115]: 取得方法
            - definition [ref=f414e116]: 弊社サイトのお問い合わせフォームからの送信。お問い合わせ内容のメール受信。
            - term [ref=f414e117]: 個人情報の利用・提供について
            - definition [ref=f414e118]: 個人情報は、前述の目的以外には利用・提供しません。 前述の目的以外でみなさまの個人情報を利用・提供する場合には、必ず事前にご本人に通知し、同意をいただいた上で行います。 ただし、裁判所、検察庁、警察等の法的機関から開示・提供を要求された場合に限り、これに応じる場合があります。
            - term [ref=f414e119]: 個人情報を提供しなかった場合に生じる結果について
            - definition [ref=f414e120]: 当社がお客様などご本人に個人情報の提供をお願いした場合、ご本人から当社への個人情報の提供は任意です。ただしご提供いただけない情報の種類によって、当社からのサービスの一部又は全部をご提供できない場合があります。
            - term [ref=f414e121]: 個人情報の委託について
            - definition [ref=f414e122]: 当社は、お預かりした個人情報の処理を利用目的の範囲内で第三者に委託する場合があります。 これらの第三者は、十分な個人情報のセキュリティー水準にあることを確認の上選定し、契約等を通じて、必要かつ適切な監督を行います。
            - term [ref=f414e123]: 個人情報の管理について
            - definition [ref=f414e124]: 当社は本「個人情報の取扱いについて」を継続的に改善・是正します。その際利用者に予告なく変更することがあります。
            - term [ref=f414e125]: 個人情報の開示、訂正、削除について
            - definition [ref=f414e126]: 当社は、ご本人が自らの個人情報の利用目的の通知、開示、訂正、第三者提供記録の開示、停止、または消去などを希望される場合、ご本人であることを確認したうえで、すみやかに実施します。
            - term [ref=f414e127]: 個人情報の取扱いに関するお問い合わせについて
            - definition [ref=f414e128]:
