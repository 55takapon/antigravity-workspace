          - generic [ref=f215e16]:
            - generic [ref=f215e17]:
              - generic [ref=f215e18]:
                - text: この度、九州北部豪雨の発生に際し、お亡くなられた方々のご冥福をお祈りするとともに、被災された方々に対し、心よりお見舞い申し上げます。
                - paragraph
                - paragraph [ref=f215e19]: 無料相談会実行委員会では、罹災証明の手続きやお困りごとの臨時の無料相談会を開催しております。
              - heading "無料相談会について" [level=2] [ref=f215e20]
              - paragraph [ref=f215e21]:
                - text: 福岡県朝倉市の
                - strong [ref=f215e22]: 専門家による無料相談会実行委員会
                - text: では、「朝倉市の暮らしと事業のサポート」をテーマに、「相続」「遺言」「悪徳商法」「成年後見制度」などの仕組みや手続の方法についての相談、「事業承継」「労使問題」「税務」「集客アップ」などの仕組みや手続の方法についての相談、そのほか行政書士・司法書士・社会保険労務・税理士など各専門家の日常的な取り扱い業務についても相談に応じております。
              - paragraph [ref=f215e23]: 相談会は、偶数月の１５日（原則）に行っており、会場は甘木郵便局さんをお借りしております。お気軽に立ち寄って頂けるように会場は甘木郵便局ロビーで行っておりますが、人目があるので話しづらい方のために個室もご用意しております。
              - heading "第18回 専門家による無料相談会" [level=3] [ref=f215e24]
