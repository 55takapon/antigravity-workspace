          - paragraph [ref=f114e55]: 個人情報の取り扱いについて
          - paragraph
          - paragraph [ref=f114e56]: 本「お問い合わせフォーム」（以下、当フォームという）にご入力いただきましたお客様のご氏名・メールアドレス等の個人情報は、お客様のお問い合わせに対し当社から回答するために利用させていただきます。
          - paragraph [ref=f114e57]: 当フォームにて取得した個人情報は、法令により開示を求められる場合を除き、ご本人の同意なしに第三者へ開示または提供することはありません。
          - paragraph [ref=f114e58]: お客様から取得する個人情報は、当社からの回答のために必要です。必要な個人情報の全部または一部が取得できない場合は、お問い合わせに回答ができない場合があります。
          - paragraph [ref=f114e59]: 当フォームで取得した個人情報は、当社からの対応が済み次第破棄いたします。
          - paragraph [ref=f114e60]: 開示等（利用目的の通知、開示、内容の訂正・追加・削除、利用の停止または消去、第三者への提供の停止）及び第三者提供記録の開示は、下記の個人情報お問い合わせ窓口へご連絡ください。
          - paragraph
          - paragraph [ref=f114e61]: 【個人情報お問い合わせ窓口】 〒810-0021 福岡県福岡市中央区今泉一丁目9番14号 西日本新聞天神南ビル 株式会社西日本新聞メディアラボ 経営統括部 個人情報問合せ係 メールアドレス：info@medialab.co.jp TEL:092-731-2282（受付時間 10:00～18:00※） ※土・日曜日、祝日、年末年始、ゴールデンウィーク期間は翌営業日以降の対応とさせていただきます。
          - paragraph
          - paragraph [ref=f114e62]: 当社ではクッキー（Cookies）等により、ご本人が容易に認識できない方法による個人情報の取得は行っておりません。 また当社のサイトでは個人情報を入力していただく部分にはすべてSSL（Secure Sockets Layer）のデータ暗号化システムを利用しております。さらに、サイト内における情報の保護にもファイアウオールを設置するなどの方策を採っております。ただし、インターネット通信の性格上、セキュリティを完全に保証するものではありません。あらかじめご了承ください。
          - paragraph
          - paragraph [ref=f114e63]:
            - text: 当社の基本的なプライバシーポリシーはこちらのページでご覧いただけます。
