              - row [ref=f106e68]:
                - columnheader "お問い合わせ内容" [ref=f106e69]
              - row [ref=f106e70]:
                - cell [ref=f106e71]: 有限会社ウェブジムご担当者様突然のご連絡失礼いたします。わたくし、ジェットプロデュース の田中克章と申します。社名の『ウェブジム』は、みんなが笑顔で成長できる、ぬくもりある場としての体育館。その体育館のような場をウェブで実現したい、と書かれていました。ウェブをもっとリアルに、もっと温かく。健康やスポーツの分野に絞って2005年から続けてこられたのも、同じ根から出ているのだと感じます。名前と信念が一本につながっている会社だと思い、在りたい自分を重ねました。貴社の取り組みを拝見する中で、クライアント様への継続支援について、私がお力になれる部分があるのではと考えました。サイト制作後も、クライアント様との接点を保ちながら継続支援したいものの、日々の制作案件と並行して新たに担当者を育成し、運用まで担うのは簡単ではないと思います。そこで、制作後のGoogleビジネスプロフィール運用を外部担当として担う形で、お役に立てればと考えています。■外部の運用担当として担うこと現在、クリニック、飲食店、士業事務所、学習塾など、10社以上のGoogleビジネスプロフィール運用を継続してご支援しています。外部の運用担当として、主に以下の業務をお引き受けしています。・ご提案資料の作成・商談への同席、ご説明・投稿、クチコミ返信・店舗情報の整備、改善・月次レポートの作成、ご報告・事業者様からのご質問、ご相談への対応ご提案の段階から、運用開始後の事業者様とのやり取りまで、私が責任を持って対応いたします。今の体制のままでも、継続支援のご提案がしやすくなれば、と考えています。■制作会社様との連携で大切にしていること制作会社様のコーディング業務を年単位で継続して受託してきた経験から、貴社の業務進行や確認の流れに合わせて対応いたします。貴社とクライアント様との関係を大切にし、窓口や商流を尊重したうえで、あくまで貴社の案件として携わります。運用の中で、サービスページの追加やキャンペーン用LPなど、制作に関するご相談が生まれた際は、すべて貴社へおつなぎします。■この仕事の原点私がGoogleビジネスプロフィール運用に力を入れるようになったきっかけは、かかりつけの歯科医院から、「低評価のクチコミに、どう対応すればよいのか」と相談を受けたことでした。歯科が苦手で、かかりつけも持っていなかった私が、安心して通えるようになった医院でした。その医院がクチコミ対応で困っていると聞き、何とかお役に立ちたいと思ったことが、この仕事の原点です。支援を続ける中で、良い仕事をしていても、その価値が必要な方へ届いていない事業者様は少なくないと感じています。探している方と、その力になれる事業者様をつなぐこと。Googleマップを通じて、その接点を増やすことが、私の役割だと考えています。「問い合わせが増えた」「予約につながった」と、事業者様から直接お声をいただき、一緒に変化を喜べる距離で支援できることに、大きなやりがいを感じています。■運用事例実績の一例として、関西の飲食店では、2026年5月から運用支援を開始しました。支援前の4月と、運用3か月目の7月を比較すると、・ルート検索数 月68回から月444回 約6.5倍・サイトへの遷移数 月78回から月560回 約7.2倍・電話発信数 月10回から月46回 4.6倍となりました。クチコミ数も8件から49件へ増加し、クチコミの平均評価は3.8から4.3へ上昇しています。※4月と7月の単月比較です。期間中はGoogle検索広告も一部実施しており、その間接的な影響は切り分けていません（広告クリック自体は上記に含みません）。その他の事例、具体的な対応内容、価格については、以下のページにまとめています。https://jet-produce.com/lp/partner01/ご興味をお持ちいただけましたら、一度オンラインでお話しできれば幸いです。直近で該当する案件がない場合も、今後の選択肢として、まずは情報交換できればと思います。ご多用のところ、最後までお読みいただきありがとうございました。どうぞよろしくお願いいたします。ーーーーージェットプロデュース代表 田中 克章Email kansha@jet-produce.comーーーーー
