      - generic [ref=f667e87]:
        - paragraph [ref=f667e88]: プライバシーポリシー Privacy Policy
        - paragraph [ref=f667e89]: 有限会社 ウェブアプト（以下「当社」）は、以下のとおり個人情報保護方針を定め、個人情報保護の仕組みを構築し、全従業員に個人情報保護の重要性の認識と取組みを徹底させることにより、個人情報の保護を推進致します。
        - generic [ref=f667e90]:
          - term [ref=f667e91]: 個人情報の管理
          - definition [ref=f667e92]: 当社は、お客さまの個人情報を正確かつ最新の状態に保ち、個人情報への不正アクセス・紛失・破損・改ざん・漏洩などを防止するため、セキュリティシステムの維持・管理体制の整備・社員教育の徹底等の必要な措置を講じ、安全対策を実施し個人情報の厳重な管理を行ないます。
          - term [ref=f667e93]: 個人情報の利用目的
          - definition [ref=f667e94]: お客さまからお預かりした個人情報は、当社からのご連絡や業務のご案内やご質問に対する回答として、電子メールや資料のご送付に利用いたします。
          - term [ref=f667e95]: 個人情報の第三者への開示・提供の禁止
          - definition [ref=f667e96]:
            - text: 当社は、お客さまよりお預かりした個人情報を適切に管理し、次のいずれかに該当する場合を除き、個人情報を第三者に開示いたしません。
            - list [ref=f667e97]:
              - listitem [ref=f667e98]: ・お客さまの同意がある場合
              - listitem [ref=f667e99]: ・お客さまが希望されるサービスを行なうために当社が業務を委託する業者に対して開示する場合
              - listitem [ref=f667e100]: ・法令に基づき開示することが必要である場合
          - term [ref=f667e101]: 個人情報の安全対策
          - definition [ref=f667e102]: 当社は、個人情報の正確性及び安全性確保のために、セキュリティに万全の対策を講じています。
          - term [ref=f667e103]: ご本人の照会
          - definition [ref=f667e104]: お客さまがご本人の個人情報の照会・修正・削除などをご希望される場合には、ご本人であることを確認の上、対応させていただきます。
          - term [ref=f667e105]: 法令、規範の遵守と見直し
          - definition [ref=f667e106]: 当社は、保有する個人情報に関して適用される日本の法令、その他規範を遵守するとともに、本ポリシーの内容を適宜見直し、その改善に努めます。
          - term [ref=f667e107]: お問い合せ
          - definition [ref=f667e108]: 当社の個人情報の取扱に関するお問い合せは下記までご連絡ください。 有限会社 ウェブアプト 〒955-0046 新潟県三条市興野1-10-10 tel / 0256-36-5885 fax / 0256-36-5886 mail / info@webapte.com
