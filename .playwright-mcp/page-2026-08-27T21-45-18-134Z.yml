    - generic [ref=f278e43]:
      - paragraph [ref=f278e44]: L-planningでは、どのクライアント・どの案件に対しても、 一度お会いしてご要望を伺うことをスタンス（例え、遠方であってもです！）にしています。 理由は、お話を聞かなければ、クライアントにとって 一番良い解決方法や・・・そしてお見積もりが出来ないのと、 制作してからも長いお付き合いとなるため、クライアントにも 私たちの会社や担当がどんな者かも判断して頂きたいという理由もあります。 お問い合わせを頂く時に、ご安心頂きたいのですが、お会いしたからといって、必ずしも私たちに頼まないといけないという事はありません。 後日、突然企業に訪問したり、しつこく営業電話をかけるといったことは一切いたしませんので、お気軽に相談、お問い合わせください。
