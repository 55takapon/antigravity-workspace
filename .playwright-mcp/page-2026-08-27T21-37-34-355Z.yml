      - generic [ref=f270e48]:
        - heading [level=2] [ref=f270e49]:
          - img "当社について" [ref=f270e50]
        - paragraph [ref=f270e51]: 株式会社メディアレーベルは、熊本県熊本市で営業するホームページ制作会社です。2008年創業、現在10期目を迎えた会社です。ホームページ制作実績は、創業以来述べ200社以上のホームページの制作、運営を手がけてきました。当社のお客様は、小さなお店から中小企業、大企業の法人様まで幅広い業種、分野の方にご利用頂いております。当社は創業以来、ホームページ制作を通じて地域社会に貢献することを使命としております。ホームページ制作のお手伝いをさせて頂き、そのお店・会社が繁盛すれば、それが熊本の地域活性化につながっていくのだと信じております。ホームページ制作という一見地味な仕事に見えますが、そこから生み出されるパワーは、活用次第では無限のパワーを秘めています。ホームページ制作という仕事を通じて、皆様のお役に立てるよう、精一杯努力してまいります。熊本でホームページ制作をお考えの方はぜひ当社に一度ご相談下さい。
