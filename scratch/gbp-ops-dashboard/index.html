<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📊 GBP運用管理ダッシュボード — Jet Produce</title>
<meta name="description" content="GBPクライアント運用タスクの月次進捗を一画面で管理するダッシュボード">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a14;--bg2:#111124;--bg3:#1a1a32;--bg4:#1e1e3a;
  --glass:rgba(255,255,255,0.05);--glass2:rgba(255,255,255,0.08);--glass3:rgba(255,255,255,0.12);
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--border3:rgba(255,255,255,0.25);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#7c3aed;--accent2:#a78bfa;--accent3:#c4b5fd;
  --green:#22c55e;--green-bg:rgba(34,197,94,0.12);--green-border:rgba(34,197,94,0.3);
  --yellow:#eab308;--yellow-bg:rgba(234,179,8,0.12);--yellow-border:rgba(234,179,8,0.3);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.12);--red-border:rgba(239,68,68,0.3);
  --blue:#3b82f6;--pink:#f472b6;
  --radius:12px;--radius2:8px;--radius3:6px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,.18),transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-200px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(56,189,248,.12),transparent 70%);pointer-events:none;z-index:0}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* ── Header ── */
header{padding:36px 0 20px;text-align:center}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
header p{color:var(--text2);font-size:.88rem}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.month-btn{background:var(--glass2);border:1px solid var(--border2);color:var(--text2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.month-btn:hover{background:var(--glass3);color:var(--text);border-color:var(--accent2)}
.month-label{font-size:1.15rem;font-weight:600;color:var(--text);min-width:160px;text-align:center}
.month-today{font-size:.7rem;padding:2px 8px;background:var(--accent);color:#fff;border-radius:10px;cursor:pointer;border:none;margin-left:8px;transition:.2s}
.month-today:hover{background:#6d28d9}

/* ── Summary Cards ── */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.summary-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:.25s}
.summary-card:hover{background:var(--glass2);border-color:var(--border2);transform:translateY(-1px)}
.summary-num{font-size:1.8rem;font-weight:700;line-height:1.2}
.summary-lbl{font-size:.72rem;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* Progress bar */
.progress-wrap{margin:4px auto 0;max-width:800px}
.progress-bar{height:8px;background:var(--glass2);border-radius:4px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--blue),var(--accent2));transition:width .6s ease}
.progress-label{display:flex;justify-content:space-between;margin-top:5px;font-size:.72rem;color:var(--text3)}

/* ── Actions bar ── */
.actions{display:flex;justify-content:flex-end;gap:8px;margin:12px 0 8px}
.action-btn{padding:6px 14px;border-radius:var(--radius3);border:1px solid var(--border);background:var(--glass);color:var(--text2);font-size:.75rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px}
.action-btn:hover{background:var(--glass2);color:var(--text);border-color:var(--border2)}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:32px}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:var(--bg3);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);padding:12px 10px;text-align:center;border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:2}
thead th:first-child{text-align:left;padding-left:16px;min-width:220px}
thead th .deadline{display:block;font-size:.62rem;font-weight:400;color:var(--text3);margin-top:2px;letter-spacing:0;text-transform:none}

tbody tr{transition:.15s;border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--glass2)}
tbody tr.is-blank{opacity:.4}
tbody tr.is-blank:hover{opacity:.6}

td{padding:10px;text-align:center;vertical-align:middle}
td:first-child{text-align:left;padding-left:16px}

/* Client cell */
.client-info{display:flex;align-items:center;gap:10px}
.client-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--glass2);border-radius:var(--radius2);flex-shrink:0}
.client-name{font-size:.88rem;font-weight:600;color:var(--text)}
.client-cat{font-size:.65rem;padding:1px 6px;border-radius:8px;font-weight:500;margin-top:2px;display:inline-block}

/* Task toggle button */
.task-cell{position:relative}
.toggle-btn{width:44px;height:44px;border-radius:var(--radius2);border:1px solid var(--border);background:var(--glass);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.2s;margin:0 auto;position:relative}
.toggle-btn:hover{transform:scale(1.08);border-color:var(--border3);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toggle-btn:active{transform:scale(.95)}
.toggle-btn[data-status="0"]{color:var(--text3)}
.toggle-btn[data-status="1"]{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow)}
.toggle-btn[data-status="2"]{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.toggle-btn.auto-done{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3);color:#38bdf8;cursor:default}
.toggle-btn.auto-done:hover{transform:none;box-shadow:none}
.toggle-btn.disabled{opacity:.25;cursor:default;pointer-events:none}
.auto-badge{position:absolute;top:-4px;right:-4px;font-size:.5rem;background:rgba(56,189,248,.25);color:#38bdf8;padding:1px 3px;border-radius:3px;line-height:1}

/* Row progress */
.row-progress{width:60px}
.row-bar{height:4px;background:var(--glass2);border-radius:2px;overflow:hidden}
.row-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:2px;transition:width .4s ease}
.row-pct{font-size:.65rem;color:var(--text3);margin-top:2px;text-align:center}

.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:16px 0 24px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text);font-weight:500}
.legend-swatch{width:28px;height:28px;border-radius:var(--radius3);display:flex;align-items:center;justify-content:center;font-size:.85rem}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 20px;color:var(--text);font-size:.85rem;z-index:200;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* File input hidden */
.file-input{display:none}

@media(max-width:768px){
  header h1{font-size:1.6rem}
  .summary{grid-template-columns:repeat(2,1fr)}
  .month-label{font-size:1rem;min-width:120px}
  .table-wrap{margin:0 -12px;border-radius:0;border-left:none;border-right:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="page-title">📊 GBP運用管理ダッシュボード</h1>
    <p>クライアント月次タスク進捗管理</p>
    <div class="month-nav">
      <button class="month-btn" id="prev-month" title="前月">◀</button>
      <span class="month-label" id="month-label">2026年5月</span>
      <button class="month-btn" id="next-month" title="翌月">▶</button>
      <button class="month-today" id="today-btn">今月</button>
    </div>
  </header>

  <!-- Summary -->
  <div class="summary" id="summary-cards">
    <div class="summary-card">
      <div class="summary-num" id="s-total" style="color:var(--accent2)">0</div>
      <div class="summary-lbl">全タスク</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="s-done" style="color:#4ade80">0</div>
      <div class="summary-lbl">完了</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="s-auto" style="color:#38bdf8">0</div>
      <div class="summary-lbl">自動検知</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="s-todo" style="color:var(--text2)">0</div>
      <div class="summary-lbl">未着手</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="s-overdue" style="color:#f87171">0</div>
      <div class="summary-lbl">期限超過</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="progress-label"><span id="prog-pct">0%</span><span id="prog-ratio">0/0 完了</span></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="btn-export" title="JSONエクスポート">💾 Export</button>
    <button class="action-btn" id="btn-import" title="JSONインポート">📂 Import</button>
    <button class="action-btn" id="btn-sync" onclick="syncAndReload()" title="ファイル変更を再スキャンしてチェックを更新">🔄 ファイル同期</button>
    <button class="action-btn danger" id="btn-reset" title="今月のデータをリセット">🗑️ Reset</button>
    <input type="file" class="file-input" id="file-input" accept=".json">
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--glass);border:1px solid var(--border)">⬜</div>
      <span>未着手</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--green-bg);border:1px solid var(--green-border)">✅</div>
      <span>完了</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3)">🤖</div>
      <span>自動検知</span>
    </div>

    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--glass);border:1px solid var(--border);opacity:.25">──</div>
      <span>非該当</span>
    </div>
  </div>

  <!-- Main Table -->
  <div class="table-wrap">
    <table id="main-table">
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="clients-data.js"></script>
<script src="post-status.js"></script>
<script>
// ── State ──
let currentYear = 2026;
let currentMonth = 5;

const STATUS_ICONS = { 0: '⬜', 1: '⏳', 2: '✅' };
const STATUS_LABELS = { 0: '未着手', 1: '進行中', 2: '完了' };

let appData = {};

// ── Initialize from today ──
(function initDate() {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;
})();

// ── Storage ──
function getMonthKey(y, m) {
  return `${y}-${String(m).padStart(2, '0')}`;
}

async function fetchAllData() {
  try {
    const res = await fetch('/api/data');
    if (res.ok) appData = await res.json();
  } catch(e) {
    console.error('Fetch error:', e);
  }
}

async function syncAndReload() {
  const btn = document.getElementById('btn-sync');
  btn.textContent = '⏳ スキャン中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/sync', { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      showToast('✅ ファイルを再スキャンしました。更新します...');
      setTimeout(() => location.reload(), 1000);
    } else {
      showToast('❌ 同期に失敗しました');
      btn.textContent = '🔄 ファイル同期';
      btn.disabled = false;
    }
  } catch(e) {
    showToast('❌ サーバーエラー');
    btn.textContent = '🔄 ファイル同期';
    btn.disabled = false;
  }
}

async function saveAllDataToServer() {
  try {
    await fetch('/api/data', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(appData)
    });
  } catch(e) {
    console.error('Save error:', e);
  }
}

function getMonthData(y, m) {
  const key = getMonthKey(y, m);
  if (!appData[key]) appData[key] = {};
  return appData[key];
}

async function setTaskStatus(clientId, taskId, status) {
  const key = getMonthKey(currentYear, currentMonth);
  if (!appData[key]) appData[key] = {};
  if (!appData[key][clientId]) appData[key][clientId] = {};
  appData[key][clientId][taskId] = status;
  await saveAllDataToServer();
}

function getTaskStatus(monthData, clientId, taskId) {
  return (monthData[clientId] && monthData[clientId][taskId]) || 0;
}

// ── Auto-detect posts ──
function isPostAutoDetected(clientId, year, month) {
  if (typeof POST_STATUS === 'undefined') return false;
  const key = getMonthKey(year, month);
  return !!(POST_STATUS[clientId] && POST_STATUS[clientId][key]);
}

// ── Auto-detect reports ──
function isReportAutoDetected(clientId, year, month) {
  if (typeof REPORT_STATUS === 'undefined') return false;
  const key = getMonthKey(year, month);
  return !!(REPORT_STATUS[clientId] && REPORT_STATUS[clientId][key]);
}

// ── Deadline logic ──
function getDeadlineDay(task) {
  const match = task.deadline.match(/^(\d+)日$/);
  return match ? parseInt(match[1]) : null;
}

function isOverdue(task, year, month) {
  const now = new Date();
  const day = getDeadlineDay(task);
  if (!day) return false;
  const deadline = new Date(year, month - 1, day, 23, 59, 59);
  return now > deadline;
}

function isCurrentMonth(y, m) {
  const now = new Date();
  return y === now.getFullYear() && m === (now.getMonth() + 1);
}

// ── Render ──
function renderMonthLabel() {
  document.getElementById('month-label').textContent = `${currentYear}年${currentMonth}月`;
}

function renderTableHead() {
  const thead = document.getElementById('table-head');
  let html = '<tr><th>クライアント</th>';
  TASKS.forEach(t => {
    html += `<th>${t.icon} ${t.label}<span class="deadline">〆 ${t.deadline}</span></th>`;
  });
  html += '<th>進捗</th></tr>';
  thead.innerHTML = html;
}

function renderTableBody() {
  const tbody = document.getElementById('table-body');
  const monthData = getMonthData(currentYear, currentMonth);
  let html = '';

  CLIENTS.forEach(client => {
    const isBlank = client.isBlank;
    const catColor = CATEGORY_COLORS[client.category] || '#94a3b8';
    let done = 0, total = 0;

    html += `<tr class="${isBlank ? 'is-blank' : ''}">`;

    // Client cell
    html += `<td>
      <div class="client-info">
        <div class="client-icon">${client.icon}</div>
        <div>
          <div class="client-name">${client.name}</div>
          <span class="client-cat" style="background:${catColor}22;color:${catColor};border:1px solid ${catColor}44">${client.category}</span>
        </div>
      </div>
    </td>`;

    // Task cells
    TASKS.forEach(task => {
      // Non-applicable tasks
      if (!task.required && !client[task.id]) {
        html += `<td class="task-cell"><div class="toggle-btn disabled">──</div></td>`;
        return;
      }

      // Blank clients: all disabled
      if (isBlank) {
        html += `<td class="task-cell"><div class="toggle-btn disabled">──</div></td>`;
        return;
      }

      total++;



      // Auto-detected post
      if (task.id === 'writing' && isPostAutoDetected(client.id, currentYear, currentMonth)) {
        done++;
        html += `<td class="task-cell">
          <div class="toggle-btn auto-done" title="投稿ファイル検出済（自動）">✅<span class="auto-badge">AUTO</span></div>
        </td>`;
        return;
      }

      // Auto-detected report
      if (task.id === 'report_gen' && isReportAutoDetected(client.id, currentYear, currentMonth)) {
        done++;
        html += `<td class="task-cell">
          <div class="toggle-btn auto-done" title="レポートファイル検出済（自動）">✅<span class="auto-badge">AUTO</span></div>
        </td>`;
        return;
      }

      const status = getTaskStatus(monthData, client.id, task.id);
      if (status === 2) done++;

      const overdue = isOverdue(task, currentYear, currentMonth) && status < 2;
      const overdueStyle = overdue ? 'box-shadow:0 0 0 2px var(--red);' : '';

      html += `<td class="task-cell">
        <button class="toggle-btn" data-status="${status}" data-client="${client.id}" data-task="${task.id}"
          style="${overdueStyle}"
          onclick="toggleTask(this)" title="${STATUS_LABELS[status]}">
          ${STATUS_ICONS[status]}
        </button>
      </td>`;
    });

    // Row progress
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    html += `<td class="row-progress">
      <div class="row-bar"><div class="row-fill" style="width:${pct}%"></div></div>
      <div class="row-pct">${pct}%</div>
    </td>`;

    html += '</tr>';
  });

  tbody.innerHTML = html;
}

function renderSummary() {
  const monthData = getMonthData(currentYear, currentMonth);
  let totalTasks = 0, doneCount = 0, autoCount = 0, todoCount = 0, overdueCount = 0;

  CLIENTS.forEach(client => {
    if (client.isBlank) return;

    TASKS.forEach(task => {
      if (!task.required && !client[task.id]) return;
      totalTasks++;



      // Auto-detected
      if (task.id === 'writing' && isPostAutoDetected(client.id, currentYear, currentMonth)) {
        doneCount++; autoCount++; return;
      }
      if (task.id === 'report_gen' && isReportAutoDetected(client.id, currentYear, currentMonth)) {
        doneCount++; autoCount++; return;
      }

      const status = getTaskStatus(monthData, client.id, task.id);
      if (status === 2) doneCount++;
      else { todoCount++; if (isOverdue(task, currentYear, currentMonth)) overdueCount++; }
    });
  });

  document.getElementById('s-total').textContent = totalTasks;
  document.getElementById('s-done').textContent = doneCount;
  document.getElementById('s-auto').textContent = autoCount;
  document.getElementById('s-todo').textContent = todoCount;
  document.getElementById('s-overdue').textContent = overdueCount;

  const pct = totalTasks > 0 ? Math.round(doneCount / totalTasks * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-ratio').textContent = `${doneCount}/${totalTasks} 完了`;
}

function renderAll() {
  renderMonthLabel();
  renderTableHead();
  renderTableBody();
  renderSummary();
}

// ── Toggle (2-state: 未着手 ⇄ 完了) ──
async function toggleTask(btn) {
  let status = parseInt(btn.dataset.status);
  status = status === 0 ? 2 : 0;
  btn.dataset.status = status;
  btn.innerHTML = STATUS_ICONS[status];
  btn.title    = STATUS_LABELS[status];

  if (status === 0) btn.style.boxShadow = '';

  await setTaskStatus(btn.dataset.client, btn.dataset.task, status);
  renderTableBody();
  renderSummary();
}

// ── Month Navigation ──
document.getElementById('prev-month').addEventListener('click', () => {
  currentMonth--;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  renderAll();
});

document.getElementById('next-month').addEventListener('click', () => {
  currentMonth++;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  renderAll();
});

document.getElementById('today-btn').addEventListener('click', () => {
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;
  renderAll();
});

// ── Export ──
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gbp-ops-backup-${getMonthKey(currentYear, currentMonth)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 バックアップをエクスポートしました');
});

// ── Import ──
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      // Merge with existing data
      Object.keys(imported).forEach(key => {
        appData[key] = { ...appData[key], ...imported[key] };
      });
      await saveAllDataToServer();
      renderAll();
      showToast('📂 データをインポートしました');
    } catch {
      showToast('❌ JSONファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── Reset ──
document.getElementById('btn-reset').addEventListener('click', async () => {
  if (!confirm(`${currentYear}年${currentMonth}月のデータをリセットしますか？`)) return;
  delete appData[getMonthKey(currentYear, currentMonth)];
  await saveAllDataToServer();
  renderAll();
  showToast('🗑️ 今月のデータをリセットしました');
});

// ── Toast ──
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ── Init ──
(async function initApp() {
  await fetchAllData();
  renderAll();
})();
</script>
