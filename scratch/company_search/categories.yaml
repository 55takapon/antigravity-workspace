      - "飲食 経営改善 {region}"

  - id: education_marketing
    name: 教育・スクール集客
    tier: 3
    cooperation_reason: >
      学習塾・スクールは地域密着で口コミが重要。
      GBPの口コミ管理が生徒募集に直結する。
    approach_angle: >
      「学習塾・スクール様向けの集客支援に、Googleビジネスプロフィールの
      運用を加えませんか？保護者がまず見るのは口コミと地図検索です」
    target_scale: 15
    keywords:
      - "学習塾 集客 {region}"
      - "スクール マーケティング {region}"
      - "教室 生徒募集 {region}"
      - "塾 集客 支援 {region}"
      - "習い事 集客 {region}"
    hp_check_keywords:
      - 学習塾
      - スクール
      - 教室
      - 生徒募集
      - 習い事
    search_variations:
      - "塾 マーケティング {region}"
      - "スクール 開業 支援"

  - id: it_support
    name: 中小企業IT支援
    tier: 3
    cooperation_reason: >
      DX支援の一環としてGBP運用を提案できる。
      IT導入補助金の活用でGBP関連ツール導入を支援。
    approach_angle: >
      「中小企業様のDX支援の一環として、Googleビジネスプロフィールの
      活用をご提案いただけませんか？デジタル集客の第一歩として最適です」
    target_scale: 15
    keywords:
