    search_variations:
      - "IT支援 会社 {region}"
      - "DXコンサル {region}"

  - id: photo_video
    name: ビジネス写真・動画制作
    tier: 3
    cooperation_reason: >
      GBPの写真投稿が集客に大きく影響する。
      プロの写真・動画でGBPのビジュアルを強化する協業が可能。
    approach_angle: >
      「貴社の撮影サービスとGBP運用を組み合わせることで、
      クライアント様の店舗魅力を最大限に発信できます」
    target_scale: 10
