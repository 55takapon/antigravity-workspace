  - id: printing_signage
    name: 印刷・看板会社
    tier: 3
    cooperation_reason: >
      オフライン集客とオンライン集客のブリッジ。
      看板制作の際にGBP連携QRコード等を提案可能。
    approach_angle: >
      「看板・チラシなどオフライン施策と連動したGoogleビジネスプロフィール運用で、
