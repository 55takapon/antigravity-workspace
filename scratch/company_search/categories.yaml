# ═══════════════════════════════════════════
#  GBPパートナー企業抽出 - 業種カテゴリ定義
# ═══════════════════════════════════════════
#
# 各カテゴリの keywords 内の {region} は実行時に地域名に置換される。
# 例: "ホームページ制作 {region}" → "ホームページ制作 大阪"
#
# tier: 1=高確度パートナー, 2=中確度（業種特化）, 3=ニッチだが可能性あり
# target_scale: 従業員数フィルタの上限

# ═══════════════════════════════════════════
#  Tier 1: 高確度パートナー
# ═══════════════════════════════════════════

categories:
  - id: web_production
    name: Web制作・HP制作会社
    tier: 1
    cooperation_reason: >
      HP制作後のMEO/GBP運用をセットで提案できる。
      Web制作会社はクライアントのHP公開後に「集客どうする？」という課題が必ず発生するため、
      GBP運用を自然に提案できる関係を構築しやすい。
    approach_angle: >
      「貴社で制作されたHPのクライアント様に、Googleビジネスプロフィールの運用支援を
      セットでご提案いただけませんか？」という協業モデルの提案。
    target_scale: 20
    keywords:
      - "ホームページ制作 {region}"
      - "Web制作会社 {region}"
      - "Webサイト制作 {region}"
      - "HP制作 {region} 小規模"
      - "ホームページ制作会社 {region} 少人数"
    hp_check_keywords:
      - ホームページ制作
      - Webサイト制作
      - Web制作
      - コーポレートサイト
      - LP制作
      - WordPress
    search_variations:
      - "{region} ホームページ制作 おすすめ"
      - "{region} Web制作 中小企業"
      - "ホームページ制作 {region} 実績"

  - id: seo_agency
    name: SEO/MEO専門会社
    tier: 1
    cooperation_reason: >
      専門性が近く、案件の相互紹介が容易。
      SEO会社はWeb上位表示の専門だが、GBP/MEO運用のリソースが不足していることが多い。
      逆にMEO専門会社とはエリアや案件規模で棲み分け可能。
    approach_angle: >
      「SEO施策と連動したGBP運用で、クライアント様のローカル検索も強化しませんか？
      貴社のSEO案件にGBP運用をアドオンでご提案いただけます」
    target_scale: 20
    keywords:
      - "SEO対策 {region}"
      - "SEO会社 {region}"
      - "MEO対策 代行 {region}"
      - "ローカルSEO {region}"
      - "検索エンジン対策 {region}"
    hp_check_keywords:
      - SEO
      - 検索エンジン最適化
      - MEO
      - Googleマップ
      - ローカルSEO
      - 被リンク
    search_variations:
      - "SEO対策会社 {region} 小規模"
      - "MEO対策 {region} 会社"

  - id: web_marketing
    name: Webマーケティング会社
    tier: 1
    cooperation_reason: >
      GBPをデジタルマーケティング施策の一部として提案できる。
      SNS運用やコンテンツマーケティングとGBPは相乗効果がある。
    approach_angle: >
      「貴社のWebマーケティングサービスに、Googleビジネスプロフィール運用を
      追加メニューとして加えませんか？集客チャネルの多角化を実現できます」
    target_scale: 20
    keywords:
      - "Web集客 {region}"
      - "Webマーケティング {region}"
      - "デジタルマーケティング {region}"
      - "SNS運用代行 {region}"
      - "コンテンツマーケティング {region}"
    hp_check_keywords:
      - マーケティング
      - Web集客
      - SNS運用
      - コンテンツマーケティング
      - 集客支援
    search_variations:
      - "Web集客 コンサル {region}"
      - "SNSマーケティング {region} 会社"

  - id: ad_agency
    name: 広告運用代理店
    tier: 1
    cooperation_reason: >
      リスティング広告とGBPのクロスセルが可能。
      広告で集客したユーザーがGBPを見て来店判断するため、両方の最適化が重要。
    approach_angle: >
      「広告運用のクライアント様に、Googleビジネスプロフィールの最適化を
      セットでご提案いただくことで、広告効果の最大化が可能です」
    target_scale: 20
    keywords:
      - "リスティング広告 {region}"
      - "広告運用代行 {region}"
      - "Google広告 代理店 {region}"
      - "Web広告 {region}"
      - "インターネット広告 {region}"
    hp_check_keywords:
      - リスティング広告
      - Google広告
      - 広告運用
      - PPC
      - Yahoo広告
    search_variations:
      - "広告代理店 {region} 中小"
      - "ネット広告 {region} 会社"

  - id: store_consulting
    name: 店舗集客コンサル
    tier: 1
    cooperation_reason: >
      店舗クライアントを多数抱えており、GBP運用の提案先が豊富。
      集客コンサルの施策メニューにGBP運用を追加できる。
    approach_angle: >
      「店舗集客のコンサルティングに、Googleビジネスプロフィールの運用を
      組み込むことで、施策の幅と成果を大きく拡大できます」
    target_scale: 20
    keywords:
      - "店舗集客 支援 {region}"
      - "店舗コンサルティング {region}"
      - "飲食店 集客 コンサル {region}"
      - "店舗 マーケティング {region}"
      - "実店舗 集客 {region}"
    hp_check_keywords:
      - 店舗集客
      - 集客支援
      - 店舗コンサル
      - 来店促進
      - 販促
    search_variations:
      - "店舗 売上アップ {region}"
      - "集客コンサルタント {region}"

# ═══════════════════════════════════════════
#  Tier 2: 中確度パートナー（業種特化）
# ═══════════════════════════════════════════

  - id: medical_hp
    name: 医療・クリニック専門HP会社
    tier: 2
    cooperation_reason: >
      医療系はGBP運用の需要が非常に高い。
      「地域名+歯医者」「地域名+内科」等の検索が多く、GBPの表示がダイレクトに集患につながる。
    approach_angle: >
      「クリニックのHP制作と合わせて、Googleビジネスプロフィールの運用代行を
      セットでご提案いただけませんか？開業直後の集患に大きく貢献します」
    target_scale: 20
    keywords:
      - "クリニック ホームページ制作 {region}"
      - "歯医者 ホームページ 制作 {region}"
      - "病院 Web制作 {region}"
      - "医療 ホームページ {region}"
      - "歯科 ホームページ制作"
    hp_check_keywords:
      - クリニック
      - 歯科
      - 医院
      - 病院
      - 医療
      - 開業支援
    search_variations:
      - "歯科医院 ホームページ制作 会社"
      - "クリニック専門 Web制作"
      - "医療系 ホームページ 制作会社"

  - id: medical_consulting
    name: 医療経営コンサル
    tier: 2
    cooperation_reason: >
      クリニックの開業支援や経営改善にGBP運用が直結する。
      開業コンサルの「集患プラン」にGBP運用を組み込める。
    approach_angle: >
      「クリニック開業支援の一環として、Googleビジネスプロフィールの
      初期設定から運用までをワンストップでご支援できます」
    target_scale: 15
    keywords:
      - "クリニック 開業支援 {region}"
      - "医療経営 コンサルタント {region}"
      - "歯科 経営 コンサル {region}"
      - "クリニック 経営 支援"
      - "医院 開業 サポート"
    hp_check_keywords:
      - 医療経営
      - クリニック開業
      - 歯科経営
      - 集患
      - 開業支援
    search_variations:
      - "クリニック開業 コンサル 会社"
      - "医療経営コンサルティング {region}"

  - id: tax_startup
    name: 士業（税理士・社労士等）特化サービス
    tier: 2
    cooperation_reason: >
      新規開業クライアントにGBPの初期設定・運用をセット提案できる。
      創業支援の税理士は、開業時に「Web集客どうする？」と相談されることが多い。
    approach_angle: >
      「ご支援されている開業クライアント様に、Googleビジネスプロフィールの
      設定・運用を当社からご提案させていただく連携はいかがでしょうか？」
    target_scale: 15
    keywords:
      - "創業支援 税理士 {region}"
      - "起業サポート 税理士 {region}"
      - "スタートアップ 税理士 {region}"
      - "開業 税理士 {region}"
      - "士業 創業支援 {region}"
    hp_check_keywords:
      - 創業支援
      - 起業サポート
      - 開業支援
      - スタートアップ
      - 会社設立
    search_variations:
      - "創業融資 税理士 {region}"
      - "起業支援 社労士 {region}"

  - id: beauty_support
    name: 美容業界支援会社
    tier: 2
    cooperation_reason: >
      美容室・サロン系はMEO効果が特に高い業種。
      「地域名+美容室」の検索ボリュームが大きく、GBP最適化が集客に直結する。
    approach_angle: >
      「サロン様向けの集客支援メニューに、Googleビジネスプロフィールの運用を
      追加しませんか？口コミ管理と連動した集客施策をご提供できます」
    target_scale: 20
    keywords:
      - "美容室 集客 支援 {region}"
      - "サロン 開業 支援 {region}"
      - "エステ マーケティング {region}"
      - "美容室 コンサル {region}"
      - "ネイルサロン 集客 {region}"
    hp_check_keywords:
