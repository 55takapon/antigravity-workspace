      - "FC本部 支援 会社"

  - id: food_consulting
    name: 飲食コンサル
    tier: 3
    cooperation_reason: >
      飲食はMEO最重要業種の1つ。
      「地域名+ランチ」「地域名+居酒屋」等の検索で
      GBP表示が来店に直結する。
    approach_angle: >
      「飲食店クライアント様の集客施策に、Googleビジネスプロフィールの
      運用を追加しませんか？口コミ対策と投稿運用で来店数アップを実現します」
    target_scale: 15
    keywords:
      - "飲食店 開業 コンサル {region}"
      - "飲食店 経営 支援 {region}"
      - "レストラン コンサルティング {region}"
      - "飲食 マーケティング {region}"
      - "飲食店 集客 支援 {region}"
    hp_check_keywords:
