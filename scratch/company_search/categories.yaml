    approach_angle: >
      「店舗デザインの完成と同時に、Googleビジネスプロフィールを最適化して
      オープン初日から検索表示される状態をつくりませんか？」
    target_scale: 15
    keywords:
      - "店舗デザイン {region}"
      - "店舗プロデュース {region}"
      - "内装デザイン 店舗 {region}"
      - "店舗設計 {region}"
      - "店舗 空間デザイン {region}"
    hp_check_keywords:
      - 店舗デザイン
      - 内装
      - プロデュース
      - 設計
      - 空間デザイン
    search_variations:
