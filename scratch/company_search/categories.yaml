      多店舗展開時のGBP一括管理ニーズがある。
      FC加盟店のGBP運用を本部経由で受注できる。
    approach_angle: >
      「FC加盟店様のGoogleビジネスプロフィールを一括で管理・運用する
      サービスをご提供できます。ブランド統一と地域最適化を両立します」
    target_scale: 30
    keywords:
      - "フランチャイズ 本部 支援"
      - "FC展開 コンサルティング"
      - "フランチャイズ 加盟店 支援"
