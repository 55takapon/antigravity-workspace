      - "サロン 集客 コンサル {region}"

  - id: real_estate_marketing
    name: 不動産マーケティング
    tier: 2
    cooperation_reason: >
      不動産は地域密着+来店型でGBPが必須。
      「地域名+不動産」の検索でGBPが表示されることが来店に直結する。
    approach_angle: >
      「不動産会社様向けのWebマーケティングに、Googleビジネスプロフィールの
      運用を加えることで、来店率の向上が期待できます」
    target_scale: 20
    keywords:
      - "不動産 集客 Web {region}"
      - "不動産 ホームページ {region}"
      - "不動産 マーケティング {region}"
      - "不動産テック {region}"
      - "不動産 Web制作 {region}"
    hp_check_keywords:
      - 不動産
      - 賃貸
      - 売買
      - 物件
      - 仲介
    search_variations:
      - "不動産会社 HP制作 {region}"
      - "不動産 集客 コンサル {region}"

