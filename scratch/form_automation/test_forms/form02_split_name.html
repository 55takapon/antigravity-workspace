<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>Form 02 - 姓名分離型</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}label{display:block;margin-top:12px;font-weight:bold}.required{color:red}.row{display:flex;gap:12px}.row>div{flex:1}input,textarea{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}button{margin-top:16px;padding:10px 24px;background:#0077cc;color:#fff;border:none;cursor:pointer}#result{margin-top:20px;color:green;font-weight:bold}</style></head>
<body>
<h1>お問い合わせ（姓名分離型）</h1>
<form id="f">
  <label>お名前 <span class="required">※必須</span></label>
  <div class="row">
    <div><input name="last_name" placeholder="姓" required></div>
    <div><input name="first_name" placeholder="名" required></div>
  </div>
  <label>フリガナ</label>
  <div class="row">
    <div><input name="last_name_kana" placeholder="セイ"></div>
    <div><input name="first_name_kana" placeholder="メイ"></div>
  </div>
  <label>会社名 <span class="required">※必須</span><input name="company" required></label>
  <label>メールアドレス <span class="required">※必須</span><input name="email" type="email" required></label>
  <label>お問い合わせ内容 <span class="required">※必須</span><textarea name="message" rows="6" required></textarea></label>
  <button type="submit">送信する</button>
</form>
<div id="result"></div>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='お問い合わせを受け付けました。ありがとうございます。'}</script>
</body></html>
