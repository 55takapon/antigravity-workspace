<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>Form 06 - プライバシーポリシー同意型</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}label{display:block;margin-top:12px;font-weight:bold}.required{color:red}input,textarea{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}.check-row{display:flex;align-items:center;gap:8px;margin-top:16px}button{margin-top:16px;padding:10px 24px;background:#0077cc;color:#fff;border:none;cursor:pointer}#result{margin-top:20px;color:green;font-weight:bold}</style></head>
<body>
<h1>お問い合わせ（プライバシー同意型）</h1>
<form id="f">
  <label>お名前 <span class="required">※必須</span><input name="contact_name" required></label>
  <label>フリガナ<input name="contact_kana"></label>
  <label>メールアドレス <span class="required">※必須</span><input name="contact_email" type="email" required></label>
  <label>お電話番号<input name="contact_tel"></label>
  <label>お問い合わせ件名<input name="contact_subject"></label>
  <label>お問い合わせ内容 <span class="required">※必須</span><textarea name="contact_message" rows="6" required></textarea></label>
  <div class="check-row">
    <input type="checkbox" name="privacy_policy" id="pp" value="同意する" required>
    <label for="pp" style="margin:0;font-weight:normal"><a href="#">プライバシーポリシー</a>に同意する <span class="required">※必須</span></label>
  </div>
  <button type="submit">送信する</button>
</form>
<div id="result"></div>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='お問い合わせを受け付けました。ありがとうございます。'}</script>
</body></html>
