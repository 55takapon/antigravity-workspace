<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>Form 04 - 郵便番号分割型</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}label{display:block;margin-top:12px;font-weight:bold}.required{color:red}.zip-row{display:flex;align-items:center;gap:6px;margin-top:4px}input,textarea{padding:8px;box-sizing:border-box}input[type=text]{width:100%}.zip-row input{width:70px}button{margin-top:16px;padding:10px 24px;background:#0077cc;color:#fff;border:none;cursor:pointer}#result{margin-top:20px;color:green;font-weight:bold}</style></head>
<body>
<h1>お問い合わせ（郵便番号分割型）</h1>
<form id="f">
  <label>会社名 <span class="required">※必須</span><input name="kaisha_mei" required></label>
  <label>担当者名 <span class="required">※必須</span><input name="tantou_sha" required></label>
  <label>郵便番号</label>
  <div class="zip-row">
    <span>〒</span>
    <input name="zip1" maxlength="3" placeholder="000">
    <span>-</span>
    <input name="zip2" maxlength="4" placeholder="0000">
  </div>
  <label>住所<input name="address"></label>
  <label>メールアドレス <span class="required">※必須</span><input name="mail_address" type="email" required></label>
  <label>電話番号<input name="tel_no"></label>
  <label>件名<input name="subject_title"></label>
  <label>お問い合わせ内容 <span class="required">※必須</span><textarea name="content" rows="6" required></textarea></label>
  <button type="submit">送信する</button>
</form>
<div id="result"></div>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='お問い合わせを受け付けました。ありがとうございます。'}</script>
</body></html>
