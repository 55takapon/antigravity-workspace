<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧠 Skill Dashboard — Antigravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a14;--bg2:#111124;--bg3:#1a1a32;
  --glass:rgba(255,255,255,0.05);--glass2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#7c3aed;--accent2:#a78bfa;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;
  --radius:12px;--radius2:8px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* BG gradient orbs */
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-200px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(56,189,248,.15),transparent 70%);pointer-events:none;z-index:0}

.wrap{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* ── Hero ── */
header{padding:48px 0 32px;text-align:center}
header h1{font-size:2.4rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1rem}
.stats{display:flex;justify-content:center;gap:32px;margin-top:20px}
.stat{text-align:center}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent2)}
.stat-lbl{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}

/* ── Controls ── */
.controls{display:flex;flex-direction:column;gap:16px;margin:24px 0}
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;background:var(--glass2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:.95rem;outline:none;transition:.2s}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(167,139,250,.15)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:1rem}

/* Category tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--glass);color:var(--text2);font-size:.8rem;cursor:pointer;transition:.2s;white-space:nowrap}
.tab:hover{background:var(--glass2);color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}

/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:48px}

/* ── Card ── */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.04),transparent);pointer-events:none}
.card:hover{background:var(--glass2);border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.card-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cat-badge{font-size:.7rem;padding:3px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.activity{font-size:.7rem;padding:3px 8px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:4px}
.activity.active{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.activity.recent{background:rgba(234,179,8,.15);color:#fbbf24;border:1px solid rgba(234,179,8,.3)}
.activity.stale{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card-name{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:4px}
.card-folder{font-size:.72rem;color:var(--text3);font-family:monospace;margin-bottom:10px}
.card-desc{font-size:.82rem;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.card-cmd{font-size:.72rem;font-family:monospace;color:var(--accent2);background:rgba(167,139,250,.1);padding:2px 7px;border-radius:4px}
.card-date{font-size:.7rem;color:var(--text3)}

/* No results */
.empty{text-align:center;padding:80px 0;color:var(--text3)}
.empty p{font-size:1.1rem;margin-bottom:8px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:32px;position:relative;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--glass2);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-name{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.modal-folder{font-size:.8rem;font-family:monospace;color:var(--text3);margin-bottom:16px}
.modal-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.modal-section{margin-bottom:20px}
.modal-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.modal-section p{font-size:.9rem;color:var(--text2);line-height:1.7}
.modal-cmd{display:inline-block;font-family:monospace;font-size:.9rem;background:rgba(167,139,250,.15);color:var(--accent2);padding:6px 12px;border-radius:6px;border:1px solid rgba(167,139,250,.25)}
.modal-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meta-item{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius2);padding:12px}
.meta-item label{font-size:.7rem;text-transform:uppercase;color:var(--text3);letter-spacing:.05em;display:block;margin-bottom:4px}
.meta-item span{font-size:.88rem;color:var(--text)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:3px 8px;background:var(--glass2);border:1px solid var(--border);border-radius:8px;color:var(--text2)}

@media(max-width:640px){
  header h1{font-size:1.8rem}
  .stats{gap:16px}
  .modal{padding:24px 20px}
  .modal-meta{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 Skill Dashboard</h1>
    <p>Antigravity エージェントスキル一覧</p>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="total-count">0</div><div class="stat-lbl">Total Skills</div></div>
      <div class="stat"><div class="stat-num" id="active-count" style="color:#4ade80">0</div><div class="stat-lbl">Active (7日以内)</div></div>
      <div class="stat"><div class="stat-num" id="recent-count" style="color:#fbbf24">0</div><div class="stat-lbl">Recent (30日以内)</div></div>
    </div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="スキルを検索... (名前・説明・タグ)" autocomplete="off">
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <p>😶 スキルが見つかりません</p>
    <small>検索ワードやカテゴリを変えてみてください</small>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="skills-data.js"></script>
<script>
// ── Utilities ──────────────────────────────────────
function daysSince(iso){
  const d=new Date(iso),now=new Date();
  return Math.floor((now-d)/(1000*60*60*24));
}
function activityInfo(iso){
  const d=daysSince(iso);
  if(d<=7) return {cls:'active',label:`${d}日前`,dot:'🟢'};
  if(d<=30) return {cls:'recent',label:`${d}日前`,dot:'🟡'};
  return {cls:'stale',label:`${d}日前`,dot:'🔴'};
}
function formatDate(iso){
  const d=new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function getCatColor(catId){
  const c=CATEGORIES.find(x=>x.id===catId);
  return c?c.color:'#94a3b8';
}
function getCatLabel(catId){
  const c=CATEGORIES.find(x=>x.id===catId);
  return c?`${c.icon} ${c.label}`:catId;
}

// ── State ──────────────────────────────────────────
let activeCategory='all', searchQuery='';

// ── Stats ──────────────────────────────────────────
function updateStats(){
  const total=SKILLS_DATA.length;
  const active=SKILLS_DATA.filter(s=>daysSince(s.lastModified)<=7).length;
  const recent=SKILLS_DATA.filter(s=>{const d=daysSince(s.lastModified);return d>7&&d<=30;}).length;
  document.getElementById('total-count').textContent=total;
  document.getElementById('active-count').textContent=active;
  document.getElementById('recent-count').textContent=recent;
}

// ── Tabs ───────────────────────────────────────────
function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML=CATEGORIES.map(c=>`
    <button class="tab${c.id===activeCategory?' active':''}" onclick="setCategory('${c.id}')">
      ${c.icon} ${c.label}
    </button>`).join('');
}
function setCategory(id){
  activeCategory=id;
  renderTabs();
  renderGrid();
}

// ── Grid ───────────────────────────────────────────
function filteredSkills(){
  let list=SKILLS_DATA;
  if(activeCategory!=='all') list=list.filter(s=>s.category===activeCategory);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    list=list.filter(s=>
      s.name.toLowerCase().includes(q)||
      s.description.toLowerCase().includes(q)||
      s.folder.toLowerCase().includes(q)||
      (s.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }
  return list;
}

function renderCard(s){
  const act=activityInfo(s.lastModified);
  const color=getCatColor(s.category);
  return `
  <div class="card" onclick="openModal('${s.id}')">
    <div class="card-header">
      <div class="card-badges">
        <span class="cat-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${getCatLabel(s.category)}</span>
      </div>
      <span class="activity ${act.cls}"><span class="dot"></span>${act.label}</span>
    </div>
    <div class="card-name">${s.name}</div>
    <div class="card-folder">${s.folder}/</div>
    <div class="card-desc">${s.description}</div>
    <div class="card-footer">
      ${s.command?`<span class="card-cmd">${s.command}</span>`:'<span></span>'}
      <span class="card-date">${formatDate(s.lastModified)}</span>
    </div>
  </div>`;
}

function renderGrid(){
  const list=filteredSkills();
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  if(list.length===0){grid.innerHTML='';empty.style.display='block';}
  else{empty.style.display='none';grid.innerHTML=list.map(renderCard).join('');}
}

// ── Modal ──────────────────────────────────────────
function openModal(id){
  const s=SKILLS_DATA.find(x=>x.id===id);
  if(!s)return;
  const act=activityInfo(s.lastModified);
  const color=getCatColor(s.category);
  document.getElementById('modal-content').innerHTML=`
    <div class="modal-name">${s.name}</div>
    <div class="modal-folder">📁 .agent/skills/${s.folder}/SKILL.md</div>
    <div class="modal-badges">
      <span class="cat-badge" style="background:${color}22;color:${color};border:1px solid ${color}44;font-size:.8rem;padding:4px 10px">${getCatLabel(s.category)}</span>
      <span class="activity ${act.cls}"><span class="dot"></span>${act.label}</span>
    </div>
    <div class="modal-section">
      <h3>概要</h3>
      <p>${s.description}</p>
    </div>
    ${s.command?`<div class="modal-section"><h3>起動コマンド</h3><span class="modal-cmd">${s.command}</span></div>`:''}
    ${s.tags&&s.tags.length?`<div class="modal-section"><h3>タグ</h3><div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`:''}
    <div class="modal-section">
      <h3>詳細情報</h3>
      <div class="modal-meta">
        <div class="meta-item"><label>最終更新</label><span>${formatDate(s.lastModified)}</span></div>
        <div class="meta-item"><label>経過日数</label><span>${daysSince(s.lastModified)}日前</span></div>
        <div class="meta-item"><label>カテゴリID</label><span>${s.category}</span></div>
        <div class="meta-item"><label>スキルID</label><span>${s.id}</span></div>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('overlay')||e.currentTarget===document.querySelector('.modal-close')){
    document.getElementById('overlay').classList.remove('show');
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal({target:document.getElementById('overlay')});});

// ── Search ─────────────────────────────────────────
document.getElementById('search').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  renderGrid();
});

// ── Init ───────────────────────────────────────────
updateStats();
renderTabs();
renderGrid();
</script>
</body>
</html>
