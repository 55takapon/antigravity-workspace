<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>ご感想フォーム | iami加古川</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/review-guide.css">
</head>
<body>

  <main class="survey-container" role="main">
    <div class="survey-card review-guide-card">

      <!-- Header -->
      <div class="review-guide__header">
        <h1 class="review-guide__title">ご感想フォーム</h1>
      </div>

      <!-- Textarea -->
      <div class="review-guide__textarea-wrapper">
        <label for="review-text" class="review-guide__label">
          ご感想をご自由にお書きください
        </label>
        <textarea
          id="review-text"
          class="review-guide__textarea"
          rows="6"
          placeholder="例）料理がとても美味しく、スタッフの方も気さくで楽しい時間を過ごせました。もつ鍋が特に…"
          aria-label="口コミテキスト入力"
        ></textarea>
      </div>

      <!-- Honeypot (hidden from users) -->
      <input type="text" id="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;pointer-events:none;">

      <!-- Submit Error -->
      <p class="review-guide__error" id="submit-error" style="display:none">
        送信に失敗しました。もう一度お試しください。
      </p>

      <!-- Copy Button -->
      <button class="review-guide__copy-btn" id="copy-btn" type="button">
        <svg class="review-guide__copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
        <span id="copy-btn-text">登録</span>
      </button>

      <!-- 登録後に表示されるセクション（初期非表示） -->
      <div class="review-guide__after-submit" id="after-submit">

        <!-- Thank You Message -->
        <p class="review-guide__thanks" id="thanks-msg">ご協力ありがとうございました！</p>

        <!-- Manual Copy Fallback (shown when clipboard API fails) -->
        <div class="review-guide__manual-copy" id="manual-copy" style="display:none">
          <p class="review-guide__manual-copy-label">
            自動コピーができませんでした。<br>
            下のテキストを長押しでコピーしてください。
          </p>
          <div class="review-guide__manual-copy-text" id="manual-copy-text"></div>
        </div>

        <!-- Divider -->
        <div class="review-guide__divider"></div>

        <!-- Google Maps CTA -->
        <div class="review-guide__cta">
          <p class="review-guide__cta-text">
            よろしければ、Googleマップにも<br>
            口コミお願いします。
          </p>
          <a href="#" class="review-guide__map-btn" id="map-btn" target="_blank" rel="noopener noreferrer">
            <svg class="review-guide__map-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <span>Googleマップへ</span>
          </a>
          <p class="review-guide__cta-hint">＼ コピー済みの感想を貼り付けるだけ ／</p>
        </div>

      </div>

    </div>

    <!-- Back Link -->
    <footer class="survey-footer review-guide__footer">
      <a href="index.html" class="review-guide__back-link" id="back-link">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        戻る
      </a>
    </footer>

  </main>

  <script>
    const REVIEW_CONFIG = {
      googleReviewUrl: "https://g.page/r/CakZwjBxVisQEBM/review",
      googleMapsUrl: "https://maps.app.goo.gl/CiSB5JYxJdrpqTFh7",
      shopName: "iami加古川",
    };

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rating = urlParams.get("rating") || "";
      const ratingNum = parseInt(rating, 10) || 0;
      const isHighRating = ratingNum >= 3;

      document.getElementById("map-btn").href = REVIEW_CONFIG.googleReviewUrl;
      document.title = `ご感想フォーム | ${REVIEW_CONFIG.shopName}`;

      const copyBtn = document.getElementById("copy-btn");
      const copyBtnText = document.getElementById("copy-btn-text");
      const textarea = document.getElementById("review-text");
      const afterSubmit = document.getElementById("after-submit");
      const submitError = document.getElementById("submit-error");
      let retryCount = 0;

      copyBtn.addEventListener("click", async () => {
        const text = textarea.value.trim();
        if (!text) {
          textarea.focus();
          textarea.classList.add("is-shake");
          setTimeout(() => textarea.classList.remove("is-shake"), 500);
          return;
        }

        copyBtn.disabled = true;
        copyBtnText.textContent = "送信中...";
        submitError.style.display = "none";

        let submitOk = false;
        try {
          const res = await fetch("/.netlify/functions/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating, text, hp: document.getElementById("hp").value }),
          });
          submitOk = res.ok;
        } catch (err) {
          submitOk = false;
        }

        if (!submitOk) {
          retryCount++;
          const gaveUp = retryCount >= 3;
          copyBtn.disabled = gaveUp;
          copyBtnText.textContent = "登録";
          submitError.textContent = gaveUp
            ? "送信に失敗しました。時間をおいてから再度お試しください。"
            : "送信に失敗しました。もう一度お試しください。";
          submitError.style.display = "block";
          return;
        }

        let copySucceeded = false;
        if (isHighRating) {
          try {
            await navigator.clipboard.writeText(text);
            copySucceeded = true;
          } catch (err) {
            try {
              textarea.select();
              copySucceeded = document.execCommand("copy");
            } catch (e) {
              copySucceeded = false;
            }
          }
        }

        copyBtn.classList.add("is-copied");
        if (isHighRating) {
          copyBtnText.textContent = copySucceeded ? "登録（コピー）しました ✓" : "登録しました ✓";
        } else {
          copyBtnText.textContent = "登録しました ✓";
        }

        document.querySelector(".review-guide__header").classList.add("is-hidden");
        document.querySelector(".review-guide__textarea-wrapper").classList.add("is-hidden");
        submitError.style.display = "none";

        afterSubmit.classList.add("is-visible");

        if (isHighRating && !copySucceeded) {
          const manualCopy = document.getElementById("manual-copy");
          document.getElementById("manual-copy-text").textContent = text;
          manualCopy.style.display = "block";
        }

        if (!isHighRating) {
          const ctaText = document.querySelector(".review-guide__cta-text");
          if (ctaText) ctaText.style.display = "none";
          const ctaHint = document.querySelector(".review-guide__cta-hint");
          if (ctaHint) ctaHint.style.display = "none";
          const divider = document.querySelector(".review-guide__divider");
          if (divider) divider.style.display = "none";
          const mapBtn = document.getElementById("map-btn");
          if (mapBtn) {
            mapBtn.style.cssText = "color:#f0eeee;background:transparent;border:none;box-shadow:none;padding:4px;font-size:12px;text-decoration:none;";
            mapBtn.href = REVIEW_CONFIG.googleMapsUrl;
            const icon = mapBtn.querySelector(".review-guide__map-icon");
            if (icon) icon.style.display = "none";
          }
        }

        setTimeout(() => {
          afterSubmit.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 300);
      });
    });
  </script>

</body>
</html>
