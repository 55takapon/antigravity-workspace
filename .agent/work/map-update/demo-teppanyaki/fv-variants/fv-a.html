<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鉄板小料理 ふた葉 | First View A</title>
  <style>
    :root {
      --ink: #151311;
      --ivory: #f7f0e3;
      --ivory-muted: #ddd2c2;
      --copper: #b7794d;
      --line: rgba(247, 240, 227, .34);
      --line-green: #0b8244;
      --serif: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", serif;
      --sans: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ivory);
      background: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 4px;
    }

    .site-header {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(13, 12, 10, .7), rgba(13, 12, 10, .08));
    }

    .header-inner {
      width: min(100% - 80px, 1360px);
      min-height: 88px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      gap: 18px;
      flex: 0 0 auto;
    }

    .brand-ja {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .13em;
      white-space: nowrap;
    }

    .brand-en {
      padding-left: 18px;
      border-left: 1px solid var(--line);
      color: var(--ivory-muted);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .28em;
      line-height: 1.4;
      white-space: nowrap;
    }

    .desktop-navigation {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(18px, 2vw, 34px);
      min-width: 0;
      margin-left: auto;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      color: #f4ede2;
      font-size: 12px;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .nav-link::after {
      position: absolute;
      right: 0;
      bottom: 7px;
      left: 0;
      height: 1px;
      background: var(--copper);
      content: "";
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .25s ease;
    }

    .nav-link:hover::after,
    .nav-link:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .header-cta,
    .mobile-cta,
    .hero-cta {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-green);
      background: #08783d;
      color: #fff;
      font-weight: 700;
      letter-spacing: .04em;
      transition: background-color .2s ease, transform .2s ease;
    }

    .header-cta:hover,
    .mobile-cta:hover,
    .hero-cta:hover {
      background: #055f31;
    }

    .header-cta {
      min-width: 130px;
      padding: 0 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .mobile-cta {
      display: none;
    }

    .hero {
      position: relative;
      min-height: 720px;
      height: 100svh;
      max-height: 980px;
      isolation: isolate;
      overflow: hidden;
    }

    .hero-image {
      position: absolute;
      z-index: -3;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(12, 11, 9, .94) 0%, rgba(12, 11, 9, .73) 27%, rgba(12, 11, 9, .08) 59%, rgba(12, 11, 9, .14) 100%),
        linear-gradient(180deg, rgba(12, 11, 9, .23) 0%, transparent 51%, rgba(12, 11, 9, .38) 100%);
      content: "";
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      right: clamp(40px, 7vw, 112px);
      bottom: 0;
      left: clamp(40px, 7vw, 112px);
      height: 1px;
      background: linear-gradient(90deg, var(--copper) 0 14%, var(--line) 14%);
      content: "";
    }

    .hero-inner {
      width: min(100% - 80px, 1360px);
      height: 100%;
      min-height: inherit;
      margin-inline: auto;
      padding-top: 146px;
      padding-bottom: clamp(68px, 10vh, 110px);
      display: flex;
      align-items: flex-end;
    }

    .hero-copy {
      position: relative;
      width: min(640px, 55vw);
      padding-left: clamp(24px, 3vw, 44px);
    }

    .hero-copy::before {
      position: absolute;
      top: 7px;
      bottom: 5px;
      left: 0;
      width: 1px;
      background: linear-gradient(180deg, var(--copper), rgba(183, 121, 77, .2));
      content: "";
    }

    .hero-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(42px, 4.3vw, 64px);
      font-weight: 500;
      letter-spacing: .075em;
      line-height: 1.42;
      text-wrap: balance;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .38);
    }

    .title-line {
      display: block;
      white-space: nowrap;
    }

    .hero-subcopy {
      max-width: 520px;
      margin: 28px 0 0;
      color: #eee5d8;
      font-size: clamp(14px, 1.15vw, 16px);
      font-weight: 500;
      letter-spacing: .075em;
      line-height: 2;
    }

    .hero-cta {
      min-width: 280px;
      min-height: 58px;
      margin-top: 36px;
      padding: 0 28px;
      font-size: 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .25);
    }

    .hero-cta::after {
      width: 22px;
      height: 1px;
      margin-left: 18px;
      background: currentColor;
      content: "";
    }

    .steam-line {
      position: absolute;
      z-index: -1;
      right: 18%;
      bottom: 6%;
      width: min(290px, 20vw);
      height: 210px;
      border-right: 1px solid rgba(247, 240, 227, .24);
      border-radius: 50%;
      opacity: .7;
      transform: rotate(-11deg);
      pointer-events: none;
    }

    @media (max-width: 1190px) {
      .desktop-navigation {
        gap: 16px;
      }

      .nav-link {
        font-size: 11px;
      }

      .header-cta {
        min-width: 116px;
        padding-inline: 14px;
      }
    }

    @media (max-width: 959px) {
      .header-inner {
        width: calc(100% - 48px);
        min-height: 78px;
      }

      .desktop-navigation,
      .header-cta {
        display: none;
      }

      .mobile-cta {
        display: inline-flex;
        min-width: 170px;
        min-height: 46px;
        padding-inline: 18px;
        font-size: 12px;
      }

      .hero {
        min-height: 700px;
      }

      .hero::before {
        background:
          linear-gradient(90deg, rgba(12, 11, 9, .8) 0%, rgba(12, 11, 9, .44) 48%, rgba(12, 11, 9, .1) 100%),
          linear-gradient(180deg, rgba(12, 11, 9, .22) 0%, transparent 42%, rgba(12, 11, 9, .8) 100%);
      }

      .hero-inner {
        width: calc(100% - 64px);
        padding-bottom: 74px;
      }

      .hero-copy {
        width: min(590px, 78vw);
      }

      .hero-title {
        font-size: clamp(42px, 5.4vw, 56px);
      }
    }

    @media (max-width: 599px) {
      .header-inner {
        width: calc(100% - 32px);
        min-height: 70px;
        gap: 12px;
      }

      .brand {
        min-height: 52px;
      }

      .brand-ja {
        font-size: 16px;
        letter-spacing: .1em;
      }

      .brand-en {
        display: none;
      }

      .mobile-cta {
        min-width: 0;
        min-height: 44px;
        padding-inline: 14px;
        font-size: 11px;
      }

      .hero {
        min-height: 690px;
        height: 100svh;
        max-height: 860px;
      }

      .hero-image {
        object-position: 56% center;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(12, 11, 9, .38) 0%, rgba(12, 11, 9, .02) 36%, rgba(12, 11, 9, .32) 51%, rgba(12, 11, 9, .94) 100%),
          linear-gradient(90deg, rgba(12, 11, 9, .15), transparent 62%);
      }

      .hero::after {
        right: 16px;
        left: 16px;
      }

      .hero-inner {
        width: calc(100% - 32px);
        padding-top: 104px;
        padding-bottom: 48px;
      }

      .hero-copy {
        width: 100%;
        padding-left: 19px;
      }

      .hero-copy::before {
        top: 5px;
        bottom: 3px;
      }

      .hero-title {
        font-size: clamp(31px, 8.9vw, 35px);
        letter-spacing: .04em;
        line-height: 1.42;
      }

      .hero-subcopy {
        margin-top: 18px;
        font-size: 13px;
        letter-spacing: .045em;
        line-height: 1.8;
      }

      .hero-cta {
        width: 100%;
        min-width: 0;
        min-height: 54px;
        margin-top: 24px;
        padding-inline: 16px;
        font-size: 13px;
      }

      .steam-line {
        right: -18%;
        bottom: 8%;
        width: 64vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="鉄板小料理 ふた葉 ホーム">
        <span class="brand-ja">鉄板小料理 ふた葉</span>
        <span class="brand-en">FUTABA<br>TEPPAN</span>
      </a>
      <nav class="desktop-navigation" aria-label="メインナビゲーション">
        <a class="nav-link" href="#concept">ふた葉について</a>
        <a class="nav-link" href="#menu">お品書き</a>
        <a class="nav-link" href="#space">店内</a>
        <a class="nav-link" href="#first-visit">はじめての方へ</a>
        <a class="nav-link" href="#access">店舗案内</a>
      </nav>
      <a class="header-cta" href="#line">LINEで相談</a>
      <a class="mobile-cta" href="#line">LINEで席を相談する</a>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" src="../images/hero-couple.webp" alt="鉄板カウンター越しに迎える店主夫婦">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 class="hero-title" id="hero-title"><span class="title-line">鉄板の向こうに、</span><span class="title-line">いつもの笑顔。</span></h1>
          <p class="hero-subcopy">夫婦ふたりで営む、小さな鉄板焼き店。焼ける音と湯気を囲んで、肩の力を抜ける時間を。</p>
          <a class="hero-cta" id="line" href="#">LINEで席について相談する</a>
        </div>
      </div>
      <span class="steam-line" aria-hidden="true"></span>
    </section>
  </main>
</body>
</html>
